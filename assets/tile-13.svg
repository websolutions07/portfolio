<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190">
  <!-- tile-13 — gallery tile: honey drips over a yolk sphere -->
  <defs>
    <linearGradient id="tile13-bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.5" stop-color="#ffbe4a"/>
      <stop offset="1" stop-color="#7a3502"/>
    </linearGradient>
    <linearGradient id="tile13-drip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c96f04"/>
      <stop offset="0.2" stop-color="#ffd45e"/>
      <stop offset="0.42" stop-color="#fffbe8"/>
      <stop offset="0.68" stop-color="#ffb01a"/>
      <stop offset="1" stop-color="#8f4002"/>
    </linearGradient>
    <linearGradient id="tile13-drip-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f3a02"/>
      <stop offset="0.24" stop-color="#ff9c1a"/>
      <stop offset="0.46" stop-color="#ffeeb8"/>
      <stop offset="0.7" stop-color="#f07c06"/>
      <stop offset="1" stop-color="#5c2001"/>
    </linearGradient>
    <radialGradient id="tile13-glow" cx="24%" cy="12%" r="70%">
      <stop offset="0" stop-color="#fffdf0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fffdf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile13-yolk" cx="32%" cy="25%" r="80%">
      <stop offset="0" stop-color="#fff8c4"/>
      <stop offset="0.26" stop-color="#ffd42e"/>
      <stop offset="0.7" stop-color="#ef8c04"/>
      <stop offset="1" stop-color="#7d3302"/>
    </radialGradient>
    <radialGradient id="tile13-amber" cx="34%" cy="26%" r="78%">
      <stop offset="0" stop-color="#ffe6bc"/>
      <stop offset="0.3" stop-color="#ff9a20"/>
      <stop offset="0.76" stop-color="#c25405"/>
      <stop offset="1" stop-color="#421801"/>
    </radialGradient>
    <radialGradient id="tile13-lime" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#f4ffd2"/>
      <stop offset="0.34" stop-color="#a8f02a"/>
      <stop offset="0.82" stop-color="#4a8804"/>
      <stop offset="1" stop-color="#173001"/>
    </radialGradient>
    <radialGradient id="tile13-bounce" cx="76%" cy="84%" r="46%">
      <stop offset="0" stop-color="#ffdc94" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffdc94" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile13-spec">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile13-vig" cx="46%" cy="38%" r="78%">
      <stop offset="0.5" stop-color="#3d1a01" stop-opacity="0"/>
      <stop offset="1" stop-color="#3d1a01" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="tile13-soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="tile13-shadow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="tile13-warp" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.006" numOctaves="2" seed="19" result="tile13-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="tile13-noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="tile13-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" seed="131"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.44"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="280" height="190" fill="url(#tile13-bg)"/>
  <rect width="280" height="190" fill="url(#tile13-glow)"/>

  <!-- out-of-focus depth -->
  <g filter="url(#tile13-soft)" opacity="0.7">
    <circle cx="40" cy="160" r="34" fill="#ffd45e"/>
    <circle cx="250" cy="150" r="30" fill="#a3450a"/>
  </g>

  <!-- honey drips hanging from the top edge -->
  <g filter="url(#tile13-warp)">
    <path d="M20 -6h30v104a15 15 0 0 1-30 0z" fill="url(#tile13-drip)"/>
    <path d="M74 -6h22v66a11 11 0 0 1-22 0z" fill="url(#tile13-drip-b)"/>
    <path d="M128 -6h34v138a17 17 0 0 1-34 0z" fill="url(#tile13-drip)"/>
    <path d="M188 -6h24v88a12 12 0 0 1-24 0z" fill="url(#tile13-drip-b)"/>
    <path d="M236 -6h30v54a15 15 0 0 1-30 0z" fill="url(#tile13-drip)"/>
  </g>

  <!-- falling droplets -->
  <g>
    <circle cx="85" cy="92" r="8" fill="url(#tile13-amber)"/>
    <circle cx="200" cy="122" r="6.5" fill="url(#tile13-amber)"/>
    <circle cx="251" cy="80" r="7.5" fill="url(#tile13-amber)"/>
  </g>

  <!-- yolk sphere catching the pour -->
  <ellipse cx="106" cy="182" rx="48" ry="12" fill="#5c2401" opacity="0.45" filter="url(#tile13-shadow)"/>
  <g>
    <circle cx="104" cy="140" r="52" fill="url(#tile13-yolk)"/>
    <circle cx="104" cy="140" r="52" fill="url(#tile13-bounce)"/>
    <ellipse cx="83" cy="117" rx="13.5" ry="9" fill="url(#tile13-spec)" transform="rotate(-28 83 117)"/>
    <ellipse cx="77" cy="111" rx="4.4" ry="2.8" fill="#ffffff" opacity="0.94" transform="rotate(-28 77 111)"/>
  </g>

  <!-- amber companion sphere -->
  <g>
    <circle cx="222" cy="164" r="30" fill="url(#tile13-amber)"/>
    <ellipse cx="210" cy="151" rx="7.6" ry="5" fill="url(#tile13-spec)" transform="rotate(-30 210 151)"/>
    <ellipse cx="206" cy="147" rx="2.6" ry="1.7" fill="#ffffff" opacity="0.92" transform="rotate(-30 206 147)"/>
  </g>

  <!-- lime accent beads -->
  <g>
    <circle cx="166" cy="164" r="14" fill="url(#tile13-lime)"/>
    <ellipse cx="160" cy="158" rx="3.6" ry="2.4" fill="#ffffff" opacity="0.88" transform="rotate(-30 160 158)"/>
    <circle cx="42" cy="118" r="9" fill="url(#tile13-lime)"/>
    <circle cx="266" cy="118" r="7" fill="url(#tile13-lime)"/>
  </g>

  <rect width="280" height="190" fill="url(#tile13-vig)"/>
  <rect width="280" height="190" filter="url(#tile13-grain)" opacity="0.3" style="mix-blend-mode:overlay"/>
</svg>
