  <!-- organic haze wisps -->
  <g filter="url(#p01a-organic)" opacity="0.16">
    <ellipse cx="300" cy="250" rx="240" ry="42" fill="#f4f7e6"/>
    <ellipse cx="700" cy="228" rx="200" ry="34" fill="#ffffff"/>
  </g>

  <rect width="900" height="620" fill="url(#p01a-vignette)"/>
  <rect width="900" height="620" filter="url(#p01a-grain)" opacity="0.3"/>
</svg>
