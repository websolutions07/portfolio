  <rect width="900" height="620" fill="url(#p01a-sun)"/>

  <!-- far, out-of-focus foliage bank -->
  <g filter="url(#p01a-blur-far)" opacity="0.95">
    <ellipse cx="150" cy="255" rx="230" ry="90" fill="#5f7a52"/>
    <ellipse cx="470" cy="238" rx="250" ry="80" fill="#54704a"/>
    <ellipse cx="790" cy="262" rx="220" ry="92" fill="#48653f"/>
    <ellipse cx="330" cy="300" rx="280" ry="86" fill="#3c5836"/>
    <ellipse cx="700" cy="312" rx="260" ry="82" fill="#365030"/>
    <circle cx="205" cy="228" r="24" fill="#e8a34c" opacity="0.75"/>
    <circle cx="392" cy="214" r="20" fill="#f0b95a" opacity="0.7"/>
    <circle cx="612" cy="232" r="26" fill="#dd8b3c" opacity="0.7"/>
    <circle cx="812" cy="210" r="18" fill="#efe0bd" opacity="0.65"/>
    <circle cx="86" cy="236" r="19" fill="#b79ae8" opacity="0.6"/>
    <circle cx="512" cy="252" r="17" fill="#c4aef0" opacity="0.55"/>
  </g>

  <!-- turf bed -->
  <path d="M0 300C160 268 300 306 452 292 604 278 742 312 900 288L900 620 0 620Z" fill="url(#p01a-turf)"/>

  <!-- grass blades, mid depth -->
  <g fill="none" stroke="#2c4726" stroke-linecap="round" filter="url(#p01a-blur-mid)">
    <path d="M40 470C22 400 44 356 30 312" stroke-width="6"/>
    <path d="M118 486C104 418 130 372 116 322" stroke-width="5"/>
    <path d="M232 470C244 402 216 358 230 306" stroke-width="6"/>
    <path d="M348 492C332 424 358 376 344 320" stroke-width="5"/>
    <path d="M470 476C486 410 458 362 472 308" stroke-width="6"/>
    <path d="M588 494C572 424 598 378 584 318" stroke-width="5"/>
    <path d="M702 472C718 404 690 358 704 304" stroke-width="6"/>
    <path d="M820 490C806 420 832 374 818 316" stroke-width="5"/>
    <path d="M876 466C890 402 862 358 876 310" stroke-width="5"/>
  </g>

  <!-- background blooms, out of focus -->
  <g filter="url(#p01a-blur-mid)" opacity="0.94">
    <use href="#p01a-spray" transform="translate(70 322) scale(0.6)" color="#33512c"/>
    <use href="#p01a-spray" transform="translate(300 316) scale(0.62)" color="#2e4a28"/>
    <use href="#p01a-spray" transform="translate(560 326) scale(0.58)" color="#35552e"/>
    <use href="#p01a-spray" transform="translate(820 318) scale(0.6)" color="#2c4726"/>
    <use href="#p01a-spire" transform="translate(66 342) scale(0.52)" color="#9d7fd6"/>
    <use href="#p01a-spire" transform="translate(262 336) scale(0.48)" color="#8a6acd"/>
    <use href="#p01a-spire" transform="translate(452 346) scale(0.54)" color="#b09aea"/>
    <use href="#p01a-spire" transform="translate(636 338) scale(0.5)" color="#8f6fd0"/>
    <use href="#p01a-spire" transform="translate(860 344) scale(0.52)" color="#a98cdf"/>
    <use href="#p01a-pom" transform="translate(120 292) scale(0.52)" color="#e8823a"/>
    <use href="#p01a-pom" transform="translate(238 276) scale(0.46)" color="#f0a63a"/>
    <use href="#p01a-pom" transform="translate(392 296) scale(0.5)" color="#e2702c"/>
    <use href="#p01a-pom" transform="translate(534 280) scale(0.48)" color="#eda03c"/>
    <use href="#p01a-pom" transform="translate(688 298) scale(0.52)" color="#e07830"/>
    <use href="#p01a-pom" transform="translate(842 282) scale(0.46)" color="#efac44"/>
    <use href="#p01a-round" transform="translate(178 306) scale(0.5)" color="#efe4c8"/>
    <use href="#p01a-round" transform="translate(462 312) scale(0.48)" color="#e9d9bb"/>
    <use href="#p01a-round" transform="translate(766 308) scale(0.5)" color="#e7cfc9"/>
  </g>

  <!-- second bank, filling the horizon line -->
  <g filter="url(#p01a-blur-mid)" opacity="0.96">
    <use href="#p01a-spray" transform="translate(190 366) scale(0.72)" color="#2f4c29"/>
    <use href="#p01a-spray" transform="translate(452 372) scale(0.7)" color="#2a4524"/>
    <use href="#p01a-spray" transform="translate(742 364) scale(0.74)" color="#31502b"/>
    <use href="#p01a-spire" transform="translate(168 396) scale(0.64)" color="#9b7cd8"/>
    <use href="#p01a-spire" transform="translate(374 402) scale(0.62)" color="#8768ce"/>
    <use href="#p01a-spire" transform="translate(596 394) scale(0.66)" color="#ac92e6"/>
    <use href="#p01a-spire" transform="translate(818 400) scale(0.62)" color="#9276d2"/>
    <use href="#p01a-pom" transform="translate(52 344) scale(0.62)" color="#ef8f26"/>
    <use href="#p01a-pom" transform="translate(240 334) scale(0.6)" color="#e4682a"/>
    <use href="#p01a-pom" transform="translate(452 340) scale(0.64)" color="#f2a02c"/>
    <use href="#p01a-pom" transform="translate(660 330) scale(0.6)" color="#e5712c"/>
    <use href="#p01a-pom" transform="translate(878 344) scale(0.62)" color="#f0a334"/>
    <use href="#p01a-round" transform="translate(126 352) scale(0.58)" color="#f2e6cc"/>
    <use href="#p01a-round" transform="translate(340 346) scale(0.56)" color="#eed6ce"/>
    <use href="#p01a-round" transform="translate(556 356) scale(0.58)" color="#f4ebd4"/>
    <use href="#p01a-round" transform="translate(786 348) scale(0.56)" color="#ecd2ca"/>
  </g>

  <!-- mid ground -->
  <g opacity="0.98">
    <use href="#p01a-spray" transform="translate(140 430) scale(0.86)" color="#2b4826"/>
    <use href="#p01a-spray" transform="translate(400 424) scale(0.9)" color="#25401f"/>
    <use href="#p01a-spray" transform="translate(660 434) scale(0.84)" color="#2d4c27"/>
    <use href="#p01a-spray" transform="translate(880 426) scale(0.88)" color="#233d1e"/>
    <use href="#p01a-spire" transform="translate(104 452) scale(0.8)" color="#a688e0"/>
    <use href="#p01a-spire" transform="translate(306 444) scale(0.76)" color="#8563cb"/>
    <use href="#p01a-spire" transform="translate(524 458) scale(0.86)" color="#b49bec"/>
    <use href="#p01a-spire" transform="translate(762 448) scale(0.78)" color="#9376d4"/>
    <use href="#p01a-spire" transform="translate(886 464) scale(0.72)" color="#a086dd"/>
    <use href="#p01a-round" transform="translate(56 412) scale(0.72)" color="#f4ead2"/>
    <use href="#p01a-round" transform="translate(268 382) scale(0.66)" color="#f2d6ce"/>
    <use href="#p01a-round" transform="translate(474 418) scale(0.7)" color="#f6efdb"/>
    <use href="#p01a-round" transform="translate(706 388) scale(0.68)" color="#eed4cb"/>
    <use href="#p01a-pom" transform="translate(176 396) scale(0.76)" color="#f4761b"/>
    <use href="#p01a-pom" transform="translate(388 384) scale(0.8)" color="#f6a91b"/>
    <use href="#p01a-pom" transform="translate(604 402) scale(0.72)" color="#e8541b"/>
    <use href="#p01a-pom" transform="translate(830 390) scale(0.78)" color="#f39a22"/>
  </g>

  <!-- foreground, sharp -->
  <g>
    <use href="#p01a-spray" transform="translate(90 566) scale(1.25)" color="#1f3a1a"/>
    <use href="#p01a-spray" transform="translate(346 588) scale(1.3)" color="#1b3417"/>
    <use href="#p01a-spray" transform="translate(596 570) scale(1.2)" color="#22401c"/>
    <use href="#p01a-spray" transform="translate(846 592) scale(1.28)" color="#1a3216"/>
    <use href="#p01a-spire" transform="translate(418 596) scale(1.02)" color="#8c6ad2"/>
    <use href="#p01a-spire" transform="translate(158 626) scale(1.1)" color="#7a58c4"/>
    <use href="#p01a-spire" transform="translate(742 634) scale(1.06)" color="#a184e2"/>
    <use href="#p01a-pom" transform="translate(122 476) scale(1.22)" color="#f4761b"/>
    <use href="#p01a-pom" transform="translate(300 512) scale(1.14)" color="#f6a91b"/>
    <use href="#p01a-round" transform="translate(214 560) scale(1.18)" color="#f8f0da"/>
    <use href="#p01a-round" transform="translate(58 578) scale(1.1)" color="#f4c9c4"/>
    <use href="#p01a-pom" transform="translate(524 504) scale(1.3)" color="#e8541b"/>
    <use href="#p01a-pom" transform="translate(688 470) scale(1.08)" color="#f6a91b"/>
    <use href="#p01a-round" transform="translate(622 578) scale(1.16)" color="#f8f0da"/>
    <use href="#p01a-round" transform="translate(800 542) scale(1.2)" color="#f2c4bf"/>
    <use href="#p01a-pom" transform="translate(884 610) scale(1.24)" color="#e03a1e"/>
    <use href="#p01a-pom" transform="translate(400 612) scale(1.12)" color="#f08320"/>
  </g>

  <!-- very near, defocused blooms for depth of field -->
  <g filter="url(#p01a-blur-bokeh)" opacity="0.72">
    <use href="#p01a-pom" transform="translate(-10 560) scale(1.7)" color="#f6a91b"/>
    <use href="#p01a-pom" transform="translate(910 470) scale(1.5)" color="#e8541b"/>
    <use href="#p01a-round" transform="translate(470 660) scale(1.6)" color="#f7ead0"/>
