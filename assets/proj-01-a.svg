<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Dense stylised 3D flower garden with orange pom-pom blooms, lavender spires and cream flowers">
  <defs>
    <linearGradient id="p01a-sky" x1="0.1" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#d5ddd0"/>
      <stop offset="0.26" stop-color="#b8c6b0"/>
      <stop offset="0.52" stop-color="#8ea486"/>
      <stop offset="0.78" stop-color="#5c7455"/>
      <stop offset="1" stop-color="#31462d"/>
    </linearGradient>
    <radialGradient id="p01a-sun" cx="0.72" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#fdfff4" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#e8f0d8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e8f0d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p01a-turf" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#3f5c39"/>
      <stop offset="0.55" stop-color="#26401f"/>
      <stop offset="1" stop-color="#132612"/>
    </linearGradient>

    <radialGradient id="p01a-pom-shade" cx="0.36" cy="0.3" r="0.74">
      <stop offset="0.42" stop-color="#2f1500" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#2f1500" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#1d0d00" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="p01a-pom-hi" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p01a-spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p01a-spire-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0b33" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#1a0b33" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#140826" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="p01a-spire-hi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p01a-stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f9455"/>
      <stop offset="0.5" stop-color="#3d6130"/>
      <stop offset="1" stop-color="#1d3418"/>
    </linearGradient>
    <radialGradient id="p01a-core" cx="0.36" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#ffe98f"/>
      <stop offset="0.55" stop-color="#f2b428"/>
      <stop offset="1" stop-color="#a96c07"/>
    </radialGradient>
    <radialGradient id="p01a-vignette" cx="0.5" cy="0.44" r="0.78">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>

    <filter id="p01a-blur-far" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="p01a-blur-mid" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="p01a-blur-bokeh" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="p01a-organic" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.03" numOctaves="3" seed="11" result="p01a-n"/>
      <feDisplacementMap in="SourceGraphic" in2="p01a-n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="p01a-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="5" result="p01a-g"/>
      <feColorMatrix in="p01a-g" type="matrix"
        values="0 0 0 0 0.62  0 0 0 0 0.6  0 0 0 0 0.5  1.1 0 0 0 -0.52"/>
    </filter>

    <!-- pom-pom bloom, radius ~40, tinted through currentColor -->
    <g id="p01a-pom">
      <g fill="currentColor" stroke="#2a1000" stroke-opacity="0.13" stroke-width="1.2">
        <circle cx="30" cy="0" r="9"/>
        <circle cx="25.98" cy="15" r="9"/>
        <circle cx="15" cy="25.98" r="9"/>
        <circle cx="0" cy="30" r="9"/>
        <circle cx="-15" cy="25.98" r="9"/>
        <circle cx="-25.98" cy="15" r="9"/>
        <circle cx="-30" cy="0" r="9"/>
        <circle cx="-25.98" cy="-15" r="9"/>
        <circle cx="-15" cy="-25.98" r="9"/>
        <circle cx="0" cy="-30" r="9"/>
        <circle cx="15" cy="-25.98" r="9"/>
        <circle cx="25.98" cy="-15" r="9"/>
        <circle cx="17" cy="0" r="8"/>
        <circle cx="13.02" cy="10.93" r="8"/>
        <circle cx="2.95" cy="16.74" r="8"/>
        <circle cx="-8.5" cy="14.72" r="8"/>
        <circle cx="-15.97" cy="5.81" r="8"/>
        <circle cx="-15.97" cy="-5.81" r="8"/>
        <circle cx="-8.5" cy="-14.72" r="8"/>
        <circle cx="2.95" cy="-16.74" r="8"/>
        <circle cx="13.02" cy="-10.93" r="8"/>
        <circle cx="7.5" cy="0" r="7"/>
        <circle cx="2.32" cy="7.13" r="7"/>
        <circle cx="-6.07" cy="4.41" r="7"/>
        <circle cx="-6.07" cy="-4.41" r="7"/>
        <circle cx="2.32" cy="-7.13" r="7"/>
        <circle cx="0" cy="0" r="6"/>
      </g>
      <circle cx="0" cy="0" r="41" fill="url(#p01a-pom-shade)"/>
      <circle cx="-13" cy="-14" r="22" fill="url(#p01a-pom-hi)"/>
      <g fill="url(#p01a-spec)">
        <circle cx="-27" cy="-17" r="3.2"/>
        <circle cx="-16.5" cy="-27" r="3"/>
        <circle cx="-9.5" cy="-16" r="2.6"/>
        <circle cx="-17" cy="-7" r="2.6"/>
        <circle cx="-6.5" cy="-5" r="2.2"/>
        <circle cx="-2" cy="-20" r="2.2"/>
      </g>
    </g>

    <!-- tall floret spire, ~175 tall, tinted through currentColor -->
    <g id="p01a-spire">
      <path d="M0 26C-3-30 3-90 0-158" stroke="url(#p01a-stem)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <g fill="currentColor">
        <circle cx="0" cy="-6" r="11"/><circle cx="-11" cy="-12" r="9.5"/><circle cx="11" cy="-14" r="9.5"/>
        <circle cx="0" cy="-24" r="11"/><circle cx="-12" cy="-30" r="9.5"/><circle cx="11" cy="-32" r="9"/>
        <circle cx="0" cy="-42" r="10.5"/><circle cx="-11" cy="-48" r="9"/><circle cx="10" cy="-50" r="8.5"/>
        <circle cx="0" cy="-60" r="10"/><circle cx="-10" cy="-66" r="8.5"/><circle cx="9" cy="-68" r="8"/>
        <circle cx="0" cy="-78" r="9.5"/><circle cx="-9" cy="-84" r="8"/><circle cx="8" cy="-86" r="7.5"/>
        <circle cx="0" cy="-96" r="8.5"/><circle cx="-8" cy="-101" r="7"/><circle cx="7" cy="-103" r="6.8"/>
        <circle cx="0" cy="-113" r="7.5"/><circle cx="-6.5" cy="-118" r="6"/><circle cx="6" cy="-120" r="5.8"/>
        <circle cx="0" cy="-129" r="6.5"/><circle cx="-5" cy="-134" r="5"/><circle cx="4.8" cy="-136" r="4.8"/>
        <circle cx="0" cy="-145" r="5.5"/><circle cx="-3.6" cy="-150" r="4"/><circle cx="3.6" cy="-152" r="3.8"/>
        <circle cx="0" cy="-160" r="4.5"/><circle cx="0" cy="-170" r="3.2"/>
      </g>
      <ellipse cx="0" cy="-86" rx="21" ry="92" fill="url(#p01a-spire-shade)"/>
      <ellipse cx="-9" cy="-96" rx="11" ry="72" fill="url(#p01a-spire-hi)"/>
      <g fill="url(#p01a-spec)">
        <circle cx="-9" cy="-31" r="2.6"/><circle cx="-8" cy="-67" r="2.4"/>
        <circle cx="-6.5" cy="-102" r="2.1"/><circle cx="-4" cy="-135" r="1.8"/>
      </g>
    </g>

    <!-- six-petal round bloom, tinted through currentColor -->
    <g id="p01a-round">
      <g fill="currentColor" stroke="#3a2410" stroke-opacity="0.12" stroke-width="1.1">
        <ellipse cx="17" cy="0" rx="17" ry="11"/>
        <ellipse cx="17" cy="0" rx="17" ry="11" transform="rotate(60)"/>
        <ellipse cx="17" cy="0" rx="17" ry="11" transform="rotate(120)"/>
        <ellipse cx="17" cy="0" rx="17" ry="11" transform="rotate(180)"/>
        <ellipse cx="17" cy="0" rx="17" ry="11" transform="rotate(240)"/>
        <ellipse cx="17" cy="0" rx="17" ry="11" transform="rotate(300)"/>
      </g>
      <circle cx="0" cy="0" r="34" fill="url(#p01a-pom-shade)"/>
      <circle cx="-12" cy="-12" r="20" fill="url(#p01a-pom-hi)"/>
      <circle cx="0" cy="0" r="11" fill="url(#p01a-core)"/>
      <circle cx="-3.5" cy="-3.5" r="4" fill="url(#p01a-spec)"/>
    </g>

    <!-- leaf spray -->
    <g id="p01a-leaf">
      <path d="M0 0C14-11 35-15 54-8 37 9 15 11 0 0Z" fill="currentColor"/>
      <path d="M3 0C17-6 36-9 51-6" stroke="#0c2812" stroke-opacity="0.4" stroke-width="1.6" fill="none"/>
    </g>
    <g id="p01a-spray">
      <use href="#p01a-leaf" transform="rotate(-58)"/>
      <use href="#p01a-leaf" transform="rotate(-20) scale(1.15)"/>
      <use href="#p01a-leaf" transform="rotate(16) scale(0.95)"/>
      <use href="#p01a-leaf" transform="rotate(-140) scale(1.05)"/>
      <use href="#p01a-leaf" transform="rotate(-172) scale(0.9)"/>
      <use href="#p01a-leaf" transform="rotate(-108) scale(0.8)"/>
    </g>
  </defs>

