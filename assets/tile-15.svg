<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190">
  <!-- tile-15 — gallery tile: two big glossy green spheres with orange beads -->
  <defs>
    <linearGradient id="tile15-bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fbffe8"/>
      <stop offset="0.44" stop-color="#d8f0a8"/>
      <stop offset="1" stop-color="#2e7a3a"/>
    </linearGradient>
    <radialGradient id="tile15-glow" cx="22%" cy="14%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile15-acid" cx="32%" cy="25%" r="80%">
      <stop offset="0" stop-color="#f8ffd0"/>
      <stop offset="0.24" stop-color="#c2ff2e"/>
      <stop offset="0.66" stop-color="#5aac06"/>
      <stop offset="1" stop-color="#153a02"/>
    </radialGradient>
    <radialGradient id="tile15-jade" cx="33%" cy="25%" r="80%">
      <stop offset="0" stop-color="#dcfff0"/>
      <stop offset="0.26" stop-color="#34e096"/>
      <stop offset="0.7" stop-color="#0a7a54"/>
      <stop offset="1" stop-color="#02251c"/>
    </radialGradient>
    <radialGradient id="tile15-mint" cx="34%" cy="26%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#e2fbe6"/>
      <stop offset="0.8" stop-color="#a2c6a8"/>
      <stop offset="1" stop-color="#3f5e46"/>
    </radialGradient>
    <radialGradient id="tile15-orange" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#ffe4bc"/>
      <stop offset="0.32" stop-color="#ff7f16"/>
      <stop offset="0.8" stop-color="#bd3d04"/>
      <stop offset="1" stop-color="#3d1201"/>
    </radialGradient>
    <radialGradient id="tile15-bounce" cx="76%" cy="86%" r="46%">
      <stop offset="0" stop-color="#e0ffa8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e0ffa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile15-spec">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile15-vig" cx="46%" cy="40%" r="76%">
      <stop offset="0.52" stop-color="#123a18" stop-opacity="0"/>
      <stop offset="1" stop-color="#123a18" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="tile15-soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="tile15-shadow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="tile15-melt" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013 0.018" numOctaves="2" seed="23" result="tile15-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="tile15-noise" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="tile15-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="151"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.44"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="280" height="190" fill="url(#tile15-bg)"/>
  <rect width="280" height="190" fill="url(#tile15-glow)"/>

  <!-- lime blob puddled behind the spheres -->
  <g filter="url(#tile15-melt)" opacity="0.95">
    <ellipse cx="150" cy="164" rx="132" ry="46" fill="url(#tile15-acid)"/>
  </g>

  <!-- out-of-focus depth -->
  <g filter="url(#tile15-soft)" opacity="0.7">
    <circle cx="36" cy="30" r="28" fill="#e8ffb0"/>
    <circle cx="246" cy="28" r="26" fill="#34e096"/>
  </g>

  <!-- jade sphere -->
  <ellipse cx="204" cy="140" rx="46" ry="12" fill="#03301f" opacity="0.4" filter="url(#tile15-shadow)"/>
  <g>
    <circle cx="202" cy="90" r="50" fill="url(#tile15-jade)"/>
    <circle cx="202" cy="90" r="50" fill="url(#tile15-bounce)"/>
    <ellipse cx="182" cy="68" rx="13" ry="8.6" fill="url(#tile15-spec)" transform="rotate(-30 182 68)"/>
    <ellipse cx="177" cy="63" rx="4.2" ry="2.6" fill="#ffffff" opacity="0.93" transform="rotate(-30 177 63)"/>
  </g>

  <!-- acid-green hero sphere -->
  <ellipse cx="88" cy="172" rx="58" ry="14" fill="#173d05" opacity="0.42" filter="url(#tile15-shadow)"/>
  <g>
    <circle cx="86" cy="108" r="60" fill="url(#tile15-acid)"/>
    <circle cx="86" cy="108" r="60" fill="url(#tile15-bounce)"/>
    <ellipse cx="62" cy="81" rx="16" ry="10.6" fill="url(#tile15-spec)" transform="rotate(-28 62 81)"/>
    <ellipse cx="55" cy="74" rx="5" ry="3.2" fill="#ffffff" opacity="0.94" transform="rotate(-28 55 74)"/>
  </g>

  <!-- mint companion -->
  <g>
    <circle cx="152" cy="150" r="24" fill="url(#tile15-mint)"/>
    <ellipse cx="142" cy="140" rx="6" ry="4" fill="url(#tile15-spec)" transform="rotate(-30 142 140)"/>
  </g>

  <!-- orange accent beads -->
  <g>
    <circle cx="144" cy="42" r="16" fill="url(#tile15-orange)"/>
    <ellipse cx="138" cy="35" rx="4.2" ry="2.8" fill="#ffffff" opacity="0.9" transform="rotate(-30 138 35)"/>
    <circle cx="252" cy="152" r="12" fill="url(#tile15-orange)"/>
    <circle cx="30" cy="164" r="9" fill="url(#tile15-orange)"/>
    <circle cx="252" cy="52" r="7" fill="url(#tile15-orange)"/>
  </g>

  <!-- defocused foreground bead -->
  <circle cx="18" cy="72" r="18" fill="#c2ff2e" opacity="0.45" filter="url(#tile15-shadow)"/>

  <rect width="280" height="190" fill="url(#tile15-vig)"/>
  <rect width="280" height="190" filter="url(#tile15-grain)" opacity="0.3" style="mix-blend-mode:overlay"/>
</svg>
