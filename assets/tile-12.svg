<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190">
  <!-- tile-12 — gallery tile: pearlescent bubbles rising through a pink-violet wash -->
  <defs>
    <linearGradient id="tile12-bg" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#2b0546"/>
      <stop offset="0.45" stop-color="#8b23c8"/>
      <stop offset="0.78" stop-color="#f24aa8"/>
      <stop offset="1" stop-color="#ffd0e8"/>
    </linearGradient>
    <radialGradient id="tile12-glow" cx="28%" cy="16%" r="66%">
      <stop offset="0" stop-color="#fff0fa" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff0fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile12-pearl" cx="32%" cy="24%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ffe8f6"/>
      <stop offset="0.62" stop-color="#d6b4ee"/>
      <stop offset="0.86" stop-color="#8f5cc4"/>
      <stop offset="1" stop-color="#331054"/>
    </radialGradient>
    <radialGradient id="tile12-rose" cx="33%" cy="25%" r="78%">
      <stop offset="0" stop-color="#fff0f8"/>
      <stop offset="0.3" stop-color="#ff86cc"/>
      <stop offset="0.74" stop-color="#c4177c"/>
      <stop offset="1" stop-color="#43031f"/>
    </radialGradient>
    <radialGradient id="tile12-violet" cx="34%" cy="25%" r="78%">
      <stop offset="0" stop-color="#eeddff"/>
      <stop offset="0.3" stop-color="#a05cf7"/>
      <stop offset="0.76" stop-color="#4c14a8"/>
      <stop offset="1" stop-color="#17023a"/>
    </radialGradient>
    <radialGradient id="tile12-yellow" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#fffcd6"/>
      <stop offset="0.34" stop-color="#ffd318"/>
      <stop offset="0.82" stop-color="#c07d04"/>
      <stop offset="1" stop-color="#432a01"/>
    </radialGradient>
    <radialGradient id="tile12-spec">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile12-vig" cx="46%" cy="42%" r="76%">
      <stop offset="0.5" stop-color="#1b0230" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b0230" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="tile12-soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="tile12-shadow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="tile12-wisp" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="3" seed="27" result="tile12-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="tile12-noise" scale="34" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="tile12-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.94" numOctaves="3" seed="127"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.48"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="280" height="190" fill="url(#tile12-bg)"/>
  <rect width="280" height="190" fill="url(#tile12-glow)"/>

  <!-- smoky wisps in the wash -->
  <g filter="url(#tile12-wisp)" opacity="0.55">
    <ellipse cx="90" cy="130" rx="96" ry="30" fill="#ff9fdc"/>
    <ellipse cx="200" cy="58" rx="86" ry="26" fill="#c98cff"/>
  </g>

  <!-- out-of-focus bubbles -->
  <g filter="url(#tile12-soft)" opacity="0.8">
    <circle cx="46" cy="40" r="28" fill="#ffc2e8"/>
    <circle cx="236" cy="146" r="32" fill="#6b18b8"/>
  </g>

  <!-- rising pearlescent bubble column -->
  <g>
    <ellipse cx="106" cy="150" rx="40" ry="10" fill="#210438" opacity="0.42" filter="url(#tile12-shadow)"/>
    <circle cx="104" cy="112" r="44" fill="url(#tile12-pearl)"/>
    <ellipse cx="86" cy="92" rx="11.5" ry="7.6" fill="url(#tile12-spec)" transform="rotate(-30 86 92)"/>
    <ellipse cx="81" cy="87" rx="3.8" ry="2.4" fill="#ffffff" opacity="0.95" transform="rotate(-30 81 87)"/>

    <circle cx="164" cy="72" r="30" fill="url(#tile12-rose)"/>
    <ellipse cx="152" cy="59" rx="7.6" ry="5" fill="url(#tile12-spec)" transform="rotate(-30 152 59)"/>
    <ellipse cx="148" cy="55" rx="2.6" ry="1.7" fill="#ffffff" opacity="0.92" transform="rotate(-30 148 55)"/>

    <circle cx="214" cy="112" r="24" fill="url(#tile12-violet)"/>
    <ellipse cx="204" cy="102" rx="6" ry="4" fill="url(#tile12-spec)" transform="rotate(-30 204 102)"/>

    <circle cx="52" cy="66" r="19" fill="url(#tile12-rose)"/>
    <ellipse cx="44" cy="58" rx="4.8" ry="3.2" fill="url(#tile12-spec)" transform="rotate(-30 44 58)"/>

    <circle cx="248" cy="52" r="15" fill="url(#tile12-pearl)"/>
    <circle cx="156" cy="150" r="17" fill="url(#tile12-violet)"/>
    <circle cx="34" cy="146" r="13" fill="url(#tile12-pearl)"/>
    <circle cx="196" cy="168" r="11" fill="url(#tile12-rose)"/>
    <circle cx="120" cy="30" r="10" fill="url(#tile12-pearl)"/>
    <circle cx="264" cy="176" r="9" fill="url(#tile12-rose)"/>
  </g>

  <!-- yellow accent beads -->
  <g>
    <circle cx="66" cy="176" r="13" fill="url(#tile12-yellow)"/>
    <ellipse cx="61" cy="171" rx="3.4" ry="2.2" fill="#ffffff" opacity="0.88" transform="rotate(-30 61 171)"/>
    <circle cx="204" cy="26" r="8" fill="url(#tile12-yellow)"/>
    <circle cx="140" cy="106" r="6" fill="url(#tile12-yellow)"/>
  </g>

  <rect width="280" height="190" fill="url(#tile12-vig)"/>
  <rect width="280" height="190" filter="url(#tile12-grain)" opacity="0.32" style="mix-blend-mode:overlay"/>
</svg>
