<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190">
  <!-- tile-02 — gallery tile: dense cobalt bubble cluster with acid-green beads -->
  <defs>
    <linearGradient id="tile02-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1b3fd6"/>
      <stop offset="0.5" stop-color="#0f259a"/>
      <stop offset="1" stop-color="#050a3d"/>
    </linearGradient>
    <radialGradient id="tile02-glow" cx="26%" cy="18%" r="66%">
      <stop offset="0" stop-color="#7fd0ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7fd0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile02-ball" cx="33%" cy="26%" r="78%">
      <stop offset="0" stop-color="#e8f6ff"/>
      <stop offset="0.26" stop-color="#69b6ff"/>
      <stop offset="0.7" stop-color="#1b46e0"/>
      <stop offset="1" stop-color="#07103f"/>
    </radialGradient>
    <radialGradient id="tile02-deep" cx="34%" cy="27%" r="78%">
      <stop offset="0" stop-color="#a9d2ff"/>
      <stop offset="0.3" stop-color="#2f6cf5"/>
      <stop offset="0.76" stop-color="#0e1f8f"/>
      <stop offset="1" stop-color="#03062b"/>
    </radialGradient>
    <radialGradient id="tile02-bub">
      <stop offset="0.52" stop-color="#8fe0ff" stop-opacity="0.06"/>
      <stop offset="0.84" stop-color="#a6ecff" stop-opacity="0.34"/>
      <stop offset="0.965" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </radialGradient>
    <radialGradient id="tile02-lime" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#f2ffd0"/>
      <stop offset="0.34" stop-color="#b6f53a"/>
      <stop offset="0.8" stop-color="#4e8c05"/>
      <stop offset="1" stop-color="#1b3402"/>
    </radialGradient>
    <radialGradient id="tile02-spec">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile02-vig" cx="46%" cy="40%" r="76%">
      <stop offset="0.5" stop-color="#01031f" stop-opacity="0"/>
      <stop offset="1" stop-color="#01031f" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="tile02-soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="tile02-blur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="tile02-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="3" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="280" height="190" fill="url(#tile02-bg)"/>
  <rect width="280" height="190" fill="url(#tile02-glow)"/>

  <!-- out-of-focus background bubbles -->
  <g filter="url(#tile02-soft)" opacity="0.8">
    <circle cx="60" cy="42" r="30" fill="#4aa8ff"/>
    <circle cx="214" cy="150" r="34" fill="#1b3fd6"/>
    <circle cx="246" cy="40" r="22" fill="#6fe6ff" opacity="0.7"/>
  </g>

  <!-- dense cluster of small glossy spheres -->
  <g>
    <circle cx="46" cy="120" r="26" fill="url(#tile02-ball)"/>
    <ellipse cx="35" cy="108" rx="6.6" ry="4.4" fill="url(#tile02-spec)" transform="rotate(-30 35 108)"/>
    <circle cx="86" cy="96" r="20" fill="url(#tile02-deep)"/>
    <ellipse cx="78" cy="87" rx="5" ry="3.4" fill="url(#tile02-spec)" transform="rotate(-30 78 87)"/>
    <circle cx="74" cy="140" r="17" fill="url(#tile02-ball)"/>
    <ellipse cx="67" cy="133" rx="4.2" ry="2.8" fill="url(#tile02-spec)" transform="rotate(-30 67 133)"/>
    <circle cx="112" cy="130" r="23" fill="url(#tile02-deep)"/>
    <ellipse cx="103" cy="120" rx="5.8" ry="3.9" fill="url(#tile02-spec)" transform="rotate(-30 103 120)"/>
    <circle cx="140" cy="88" r="15" fill="url(#tile02-ball)"/>
    <ellipse cx="134" cy="82" rx="3.8" ry="2.5" fill="url(#tile02-spec)" transform="rotate(-30 134 82)"/>
    <circle cx="150" cy="126" r="12" fill="url(#tile02-deep)"/>
    <circle cx="118" cy="62" r="13" fill="url(#tile02-deep)"/>
    <ellipse cx="113" cy="57" rx="3.3" ry="2.2" fill="url(#tile02-spec)" transform="rotate(-30 113 57)"/>
    <circle cx="176" cy="106" r="18" fill="url(#tile02-ball)"/>
    <ellipse cx="169" cy="98" rx="4.5" ry="3" fill="url(#tile02-spec)" transform="rotate(-30 169 98)"/>
    <circle cx="204" cy="82" r="14" fill="url(#tile02-deep)"/>
    <circle cx="196" cy="140" r="11" fill="url(#tile02-ball)"/>
    <circle cx="30" cy="72" r="12" fill="url(#tile02-deep)"/>
    <circle cx="58" cy="166" r="13" fill="url(#tile02-ball)"/>
    <circle cx="132" cy="164" r="10" fill="url(#tile02-deep)"/>
    <circle cx="230" cy="118" r="16" fill="url(#tile02-ball)"/>
    <ellipse cx="224" cy="111" rx="4" ry="2.7" fill="url(#tile02-spec)" transform="rotate(-30 224 111)"/>
    <circle cx="252" cy="88" r="9" fill="url(#tile02-deep)"/>
    <circle cx="16" cy="150" r="9" fill="url(#tile02-deep)"/>
    <circle cx="98" cy="26" r="10" fill="url(#tile02-ball)"/>
    <circle cx="164" cy="40" r="8" fill="url(#tile02-deep)"/>
  </g>

  <!-- translucent soap bubbles floating on top -->
  <g>
    <circle cx="66" cy="60" r="21" fill="url(#tile02-bub)"/>
    <ellipse cx="56" cy="50" rx="4.6" ry="3" fill="#ffffff" opacity="0.75" transform="rotate(-30 56 50)"/>
    <circle cx="158" cy="156" r="17" fill="url(#tile02-bub)"/>
    <ellipse cx="151" cy="148" rx="3.6" ry="2.4" fill="#ffffff" opacity="0.7" transform="rotate(-30 151 148)"/>
    <circle cx="216" cy="52" r="14" fill="url(#tile02-bub)"/>
    <circle cx="120" cy="106" r="10" fill="url(#tile02-bub)"/>
  </g>

  <!-- acid-green accent beads -->
  <g>
    <circle cx="90" cy="168" r="11" fill="url(#tile02-lime)"/>
    <ellipse cx="86" cy="163" rx="3" ry="2" fill="#ffffff" opacity="0.85" transform="rotate(-30 86 163)"/>
    <circle cx="188" cy="30" r="8" fill="url(#tile02-lime)"/>
    <circle cx="248" cy="164" r="6.5" fill="url(#tile02-lime)"/>
  </g>

  <!-- foreground defocus -->
  <circle cx="18" cy="30" r="18" fill="#6fe6ff" opacity="0.4" filter="url(#tile02-blur)"/>
  <circle cx="266" cy="176" r="20" fill="#1b46e0" opacity="0.6" filter="url(#tile02-blur)"/>

  <rect width="280" height="190" fill="url(#tile02-vig)"/>
  <rect width="280" height="190" filter="url(#tile02-grain)" opacity="0.32" style="mix-blend-mode:overlay"/>
</svg>
