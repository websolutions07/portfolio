<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190">
  <!-- tile-03 — gallery tile: acid-green liquid pools with pearl beads -->
  <defs>
    <linearGradient id="tile03-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f95a"/>
      <stop offset="0.48" stop-color="#3fb84a"/>
      <stop offset="1" stop-color="#04321f"/>
    </linearGradient>
    <linearGradient id="tile03-pool-a" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#eaffb0"/>
      <stop offset="0.45" stop-color="#a6f22a"/>
      <stop offset="1" stop-color="#2f8a12"/>
    </linearGradient>
    <linearGradient id="tile03-pool-b" x1="0.2" y1="0.1" x2="0.8" y2="1">
      <stop offset="0" stop-color="#6ef0c0"/>
      <stop offset="0.5" stop-color="#12a37a"/>
      <stop offset="1" stop-color="#023a2c"/>
    </linearGradient>
    <linearGradient id="tile03-pool-c" x1="0" y1="0.2" x2="1" y2="0.9">
      <stop offset="0" stop-color="#fdffe4"/>
      <stop offset="0.6" stop-color="#cdf06a"/>
      <stop offset="1" stop-color="#5f9c0a"/>
    </linearGradient>
    <radialGradient id="tile03-glow" cx="24%" cy="16%" r="70%">
      <stop offset="0" stop-color="#f6ffd6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f6ffd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile03-pearl" cx="33%" cy="26%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f2f6e8"/>
      <stop offset="0.82" stop-color="#c3cdb4"/>
      <stop offset="1" stop-color="#6b7860"/>
    </radialGradient>
    <radialGradient id="tile03-lime" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#f7ffd8"/>
      <stop offset="0.32" stop-color="#b9ff33"/>
      <stop offset="0.78" stop-color="#4f9505"/>
      <stop offset="1" stop-color="#173201"/>
    </radialGradient>
    <radialGradient id="tile03-plum" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#ffd6f2"/>
      <stop offset="0.36" stop-color="#e0219c"/>
      <stop offset="1" stop-color="#3d0428"/>
    </radialGradient>
    <radialGradient id="tile03-spec">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile03-vig" cx="46%" cy="40%" r="76%">
      <stop offset="0.5" stop-color="#02180f" stop-opacity="0"/>
      <stop offset="1" stop-color="#02180f" stop-opacity="0.52"/>
    </radialGradient>
    <filter id="tile03-liquid" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.018" numOctaves="3" seed="21" result="tile03-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="tile03-noise" scale="30" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <filter id="tile03-soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="tile03-shadow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="tile03-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" seed="29"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.46"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="280" height="190" fill="url(#tile03-bg)"/>

  <!-- displaced liquid pools -->
  <g filter="url(#tile03-liquid)">
    <ellipse cx="70" cy="52" rx="118" ry="70" fill="url(#tile03-pool-c)"/>
    <ellipse cx="212" cy="150" rx="120" ry="76" fill="url(#tile03-pool-b)"/>
    <ellipse cx="130" cy="118" rx="92" ry="52" fill="url(#tile03-pool-a)" opacity="0.92"/>
    <ellipse cx="34" cy="168" rx="60" ry="36" fill="url(#tile03-pool-b)" opacity="0.85"/>
  </g>

  <rect width="280" height="190" fill="url(#tile03-glow)"/>

  <!-- soft caustic highlights -->
  <g filter="url(#tile03-soft)" opacity="0.55">
    <ellipse cx="96" cy="44" rx="46" ry="20" fill="#fbffe0"/>
    <ellipse cx="222" cy="112" rx="34" ry="18" fill="#9dffd8"/>
  </g>

  <!-- beads resting on the surface -->
  <g>
    <ellipse cx="196" cy="72" rx="26" ry="7" fill="#03291b" opacity="0.4" filter="url(#tile03-shadow)"/>
    <circle cx="194" cy="52" r="24" fill="url(#tile03-pearl)"/>
    <ellipse cx="184" cy="41" rx="6" ry="4" fill="url(#tile03-spec)" transform="rotate(-30 184 41)"/>
    <ellipse cx="181" cy="38" rx="2.2" ry="1.4" fill="#ffffff" opacity="0.95" transform="rotate(-30 181 38)"/>

    <ellipse cx="86" cy="158" rx="24" ry="6.5" fill="#03291b" opacity="0.4" filter="url(#tile03-shadow)"/>
    <circle cx="84" cy="140" r="21" fill="url(#tile03-lime)"/>
    <ellipse cx="75" cy="131" rx="5.4" ry="3.6" fill="url(#tile03-spec)" transform="rotate(-30 75 131)"/>

    <circle cx="140" cy="86" r="13" fill="url(#tile03-plum)"/>
    <ellipse cx="135" cy="81" rx="3.4" ry="2.2" fill="#ffffff" opacity="0.85" transform="rotate(-30 135 81)"/>

    <circle cx="240" cy="146" r="15" fill="url(#tile03-pearl)"/>
    <ellipse cx="234" cy="139" rx="3.8" ry="2.5" fill="url(#tile03-spec)" transform="rotate(-30 234 139)"/>

    <circle cx="42" cy="76" r="9" fill="url(#tile03-plum)"/>
    <circle cx="160" cy="170" r="8" fill="url(#tile03-pearl)"/>
    <circle cx="262" cy="34" r="10" fill="url(#tile03-lime)"/>
  </g>

  <!-- defocused foreground droplet -->
  <circle cx="24" cy="118" r="19" fill="#eaffb0" opacity="0.5" filter="url(#tile03-shadow)"/>

  <rect width="280" height="190" fill="url(#tile03-vig)"/>
  <rect width="280" height="190" filter="url(#tile03-grain)" opacity="0.3" style="mix-blend-mode:overlay"/>
</svg>
