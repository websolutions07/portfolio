<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190">
  <!-- tile-01 — gallery tile: three huge glossy spheres, egg-yolk & tangerine -->
  <defs>
    <linearGradient id="tile01-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d8"/>
      <stop offset="0.54" stop-color="#ffd69b"/>
      <stop offset="1" stop-color="#ee9a52"/>
    </linearGradient>
    <radialGradient id="tile01-glow" cx="22%" cy="14%" r="72%">
      <stop offset="0" stop-color="#fffdf3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fffdf3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile01-yolk" cx="34%" cy="27%" r="78%">
      <stop offset="0" stop-color="#fff6bd"/>
      <stop offset="0.28" stop-color="#ffd02b"/>
      <stop offset="0.72" stop-color="#ef8904"/>
      <stop offset="1" stop-color="#8d3b02"/>
    </radialGradient>
    <radialGradient id="tile01-tang" cx="33%" cy="26%" r="80%">
      <stop offset="0" stop-color="#ffe3ba"/>
      <stop offset="0.3" stop-color="#ff8f2e"/>
      <stop offset="0.74" stop-color="#df4a08"/>
      <stop offset="1" stop-color="#78210b"/>
    </radialGradient>
    <radialGradient id="tile01-blood" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#ffcab2"/>
      <stop offset="0.3" stop-color="#f2451f"/>
      <stop offset="0.75" stop-color="#a71208"/>
      <stop offset="1" stop-color="#53060a"/>
    </radialGradient>
    <radialGradient id="tile01-bead" cx="34%" cy="28%" r="76%">
      <stop offset="0" stop-color="#d3e6ff"/>
      <stop offset="0.4" stop-color="#2f6bf0"/>
      <stop offset="1" stop-color="#0b1f6b"/>
    </radialGradient>
    <radialGradient id="tile01-bounce" cx="76%" cy="84%" r="46%">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe6a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile01-spec">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile01-vig" cx="48%" cy="42%" r="74%">
      <stop offset="0.52" stop-color="#3d1804" stop-opacity="0"/>
      <stop offset="1" stop-color="#3d1804" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="tile01-soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="tile01-shadow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="tile01-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.42"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="280" height="190" fill="url(#tile01-bg)"/>
  <rect width="280" height="190" fill="url(#tile01-glow)"/>

  <!-- out-of-focus depth layer -->
  <g filter="url(#tile01-soft)" opacity="0.75">
    <circle cx="30" cy="26" r="30" fill="#ffe07a"/>
    <circle cx="256" cy="22" r="26" fill="#ff9d3d"/>
    <circle cx="158" cy="184" r="34" fill="#f97316" opacity="0.7"/>
  </g>

  <!-- tangerine sphere -->
  <ellipse cx="198" cy="132" rx="46" ry="12" fill="#7a2a04" opacity="0.35" filter="url(#tile01-shadow)"/>
  <g>
    <circle cx="196" cy="78" r="52" fill="url(#tile01-tang)"/>
    <circle cx="196" cy="78" r="52" fill="url(#tile01-bounce)"/>
    <ellipse cx="175" cy="55" rx="14" ry="9.5" fill="url(#tile01-spec)" transform="rotate(-30 175 55)"/>
    <ellipse cx="170" cy="50" rx="4.4" ry="2.8" fill="#ffffff" opacity="0.9" transform="rotate(-30 170 50)"/>
  </g>

  <!-- blood-orange sphere -->
  <ellipse cx="242" cy="184" rx="34" ry="10" fill="#5a0c06" opacity="0.4" filter="url(#tile01-shadow)"/>
  <g>
    <circle cx="240" cy="150" r="38" fill="url(#tile01-blood)"/>
    <circle cx="240" cy="150" r="38" fill="url(#tile01-bounce)"/>
    <ellipse cx="225" cy="133" rx="10" ry="6.6" fill="url(#tile01-spec)" transform="rotate(-30 225 133)"/>
    <ellipse cx="221" cy="129" rx="3.2" ry="2" fill="#ffffff" opacity="0.88" transform="rotate(-30 221 129)"/>
  </g>

  <!-- egg-yolk hero sphere -->
  <ellipse cx="90" cy="180" rx="56" ry="14" fill="#6b2c02" opacity="0.4" filter="url(#tile01-shadow)"/>
  <g>
    <circle cx="88" cy="112" r="64" fill="url(#tile01-yolk)"/>
    <circle cx="88" cy="112" r="64" fill="url(#tile01-bounce)"/>
    <ellipse cx="62" cy="83" rx="17" ry="11.5" fill="url(#tile01-spec)" transform="rotate(-28 62 83)"/>
    <ellipse cx="55" cy="76" rx="5.4" ry="3.4" fill="#ffffff" opacity="0.92" transform="rotate(-28 55 76)"/>
  </g>

  <!-- cobalt accent beads -->
  <g>
    <circle cx="152" cy="42" r="12" fill="url(#tile01-bead)"/>
    <ellipse cx="148" cy="37" rx="3.4" ry="2.2" fill="#ffffff" opacity="0.85" transform="rotate(-30 148 37)"/>
    <circle cx="30" cy="168" r="9" fill="url(#tile01-bead)"/>
    <ellipse cx="27" cy="165" rx="2.6" ry="1.7" fill="#ffffff" opacity="0.8" transform="rotate(-30 27 165)"/>
    <circle cx="164" cy="164" r="6" fill="url(#tile01-bead)"/>
  </g>

  <!-- blurred foreground bead for depth of field -->
  <circle cx="264" cy="70" r="17" fill="#2f6bf0" opacity="0.55" filter="url(#tile01-shadow)"/>

  <rect width="280" height="190" fill="url(#tile01-vig)"/>
  <rect width="280" height="190" filter="url(#tile01-grain)" opacity="0.3" style="mix-blend-mode:overlay"/>
</svg>
