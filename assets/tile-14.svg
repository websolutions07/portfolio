<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190">
  <!-- tile-14 — gallery tile: electric-blue beads scattered on pearl cream -->
  <defs>
    <linearGradient id="tile14-bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.46" stop-color="#e2ecf2"/>
      <stop offset="1" stop-color="#93b4c8"/>
    </linearGradient>
    <radialGradient id="tile14-glow" cx="24%" cy="14%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile14-elec" cx="33%" cy="26%" r="78%">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.26" stop-color="#4fd0ff"/>
      <stop offset="0.7" stop-color="#0b57e0"/>
      <stop offset="1" stop-color="#03113f"/>
    </radialGradient>
    <radialGradient id="tile14-cobalt" cx="34%" cy="26%" r="78%">
      <stop offset="0" stop-color="#d2e4ff"/>
      <stop offset="0.28" stop-color="#3f7bff"/>
      <stop offset="0.72" stop-color="#0d229c"/>
      <stop offset="1" stop-color="#020734"/>
    </radialGradient>
    <radialGradient id="tile14-ice" cx="33%" cy="25%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#e6f6ff"/>
      <stop offset="0.82" stop-color="#9cbdd2"/>
      <stop offset="1" stop-color="#455f70"/>
    </radialGradient>
    <radialGradient id="tile14-mag" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#ffd6f2"/>
      <stop offset="0.34" stop-color="#ff2fa8"/>
      <stop offset="0.82" stop-color="#a80a62"/>
      <stop offset="1" stop-color="#33011d"/>
    </radialGradient>
    <radialGradient id="tile14-spec">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile14-vig" cx="46%" cy="40%" r="78%">
      <stop offset="0.54" stop-color="#1d3a4a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1d3a4a" stop-opacity="0.38"/>
    </radialGradient>
    <filter id="tile14-soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="tile14-shadow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="tile14-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.98" numOctaves="3" seed="149"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="280" height="190" fill="url(#tile14-bg)"/>
  <rect width="280" height="190" fill="url(#tile14-glow)"/>

  <!-- out-of-focus haze -->
  <g filter="url(#tile14-soft)" opacity="0.6">
    <circle cx="230" cy="42" r="34" fill="#8fd8ff"/>
    <circle cx="46" cy="168" r="32" fill="#5c8fb8"/>
  </g>

  <!-- soft contact shadows -->
  <g fill="#284a5e" opacity="0.28" filter="url(#tile14-shadow)">
    <ellipse cx="70" cy="86" rx="30" ry="8"/>
    <ellipse cx="164" cy="126" rx="28" ry="7.5"/>
    <ellipse cx="216" cy="72" rx="20" ry="5.5"/>
    <ellipse cx="106" cy="158" rx="22" ry="6"/>
    <ellipse cx="36" cy="126" rx="16" ry="4.5"/>
  </g>

  <!-- dense scatter of glossy beads -->
  <g>
    <circle cx="68" cy="66" r="28" fill="url(#tile14-elec)"/>
    <ellipse cx="56" cy="54" rx="7" ry="4.6" fill="url(#tile14-spec)" transform="rotate(-30 56 54)"/>
    <ellipse cx="52" cy="50" rx="2.4" ry="1.5" fill="#ffffff" opacity="0.95" transform="rotate(-30 52 50)"/>

    <circle cx="162" cy="104" r="26" fill="url(#tile14-cobalt)"/>
    <ellipse cx="151" cy="93" rx="6.6" ry="4.4" fill="url(#tile14-spec)" transform="rotate(-30 151 93)"/>
    <ellipse cx="147" cy="89" rx="2.2" ry="1.4" fill="#ffffff" opacity="0.95" transform="rotate(-30 147 89)"/>

    <circle cx="214" cy="58" r="19" fill="url(#tile14-elec)"/>
    <ellipse cx="206" cy="50" rx="4.8" ry="3.2" fill="url(#tile14-spec)" transform="rotate(-30 206 50)"/>

    <circle cx="104" cy="142" r="21" fill="url(#tile14-ice)"/>
    <ellipse cx="95" cy="133" rx="5.3" ry="3.5" fill="url(#tile14-spec)" transform="rotate(-30 95 133)"/>

    <circle cx="34" cy="114" r="15" fill="url(#tile14-cobalt)"/>
    <ellipse cx="28" cy="108" rx="3.8" ry="2.5" fill="url(#tile14-spec)" transform="rotate(-30 28 108)"/>

    <circle cx="124" cy="46" r="16" fill="url(#tile14-ice)"/>
    <circle cx="248" cy="118" r="22" fill="url(#tile14-elec)"/>
    <ellipse cx="239" cy="109" rx="5.5" ry="3.7" fill="url(#tile14-spec)" transform="rotate(-30 239 109)"/>
    <circle cx="196" cy="152" r="17" fill="url(#tile14-cobalt)"/>
    <circle cx="150" cy="166" r="12" fill="url(#tile14-elec)"/>
    <circle cx="60" cy="176" r="14" fill="url(#tile14-ice)"/>
    <circle cx="20" cy="52" r="12" fill="url(#tile14-elec)"/>
    <circle cx="172" cy="26" r="11" fill="url(#tile14-cobalt)"/>
    <circle cx="264" cy="176" r="13" fill="url(#tile14-cobalt)"/>
    <circle cx="96" cy="104" r="9" fill="url(#tile14-ice)"/>
    <circle cx="236" cy="18" r="8" fill="url(#tile14-ice)"/>
  </g>

  <!-- magenta accent beads -->
  <g>
    <circle cx="132" cy="80" r="13" fill="url(#tile14-mag)"/>
    <ellipse cx="127" cy="75" rx="3.4" ry="2.2" fill="#ffffff" opacity="0.9" transform="rotate(-30 127 75)"/>
    <circle cx="222" cy="164" r="9" fill="url(#tile14-mag)"/>
    <circle cx="82" cy="20" r="7" fill="url(#tile14-mag)"/>
    <circle cx="14" cy="150" r="6" fill="url(#tile14-mag)"/>
  </g>

  <rect width="280" height="190" fill="url(#tile14-vig)"/>
  <rect width="280" height="190" filter="url(#tile14-grain)" opacity="0.28" style="mix-blend-mode:overlay"/>
</svg>
