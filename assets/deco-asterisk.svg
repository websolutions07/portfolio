<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Chrome asterisk flower decoration">
  <defs>
    <clipPath id="decoasterisk-clip">
      <rect x="73" y="5" width="54" height="96" rx="27" />
      <rect x="73" y="5" width="54" height="96" rx="27" transform="rotate(60 100 100)" />
      <rect x="73" y="5" width="54" height="96" rx="27" transform="rotate(120 100 100)" />
      <rect x="73" y="5" width="54" height="96" rx="27" transform="rotate(180 100 100)" />
      <rect x="73" y="5" width="54" height="96" rx="27" transform="rotate(240 100 100)" />
      <rect x="73" y="5" width="54" height="96" rx="27" transform="rotate(300 100 100)" />
      <circle cx="100" cy="100" r="40" />
    </clipPath>

    <linearGradient id="decoasterisk-chrome" x1="86" y1="4" x2="118" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.13" stop-color="#e9edf3" />
      <stop offset="0.28" stop-color="#a7aeb9" />
      <stop offset="0.39" stop-color="#7d8490" />
      <stop offset="0.47" stop-color="#ffffff" />
      <stop offset="0.58" stop-color="#d3dae4" />
      <stop offset="0.72" stop-color="#8b929d" />
      <stop offset="0.86" stop-color="#5e646e" />
      <stop offset="1" stop-color="#e4e9f0" />
    </linearGradient>

    <radialGradient id="decoasterisk-sheen" cx="70" cy="56" r="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="decoasterisk-terminator" cx="150" cy="160" r="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b3038" stop-opacity="0.72" />
      <stop offset="0.55" stop-color="#3d434d" stop-opacity="0.22" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="decoasterisk-cool" x1="20" y1="180" x2="180" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7f93ad" stop-opacity="0.55" />
      <stop offset="0.5" stop-color="#c8d6e6" stop-opacity="0" />
      <stop offset="1" stop-color="#9fb4cc" stop-opacity="0.4" />
    </linearGradient>

    <filter id="decoasterisk-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" />
    </filter>

    <filter id="decoasterisk-drop" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <filter id="decoasterisk-grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="decoasterisk-noise" />
      <feColorMatrix in="decoasterisk-noise" type="saturate" values="0" result="decoasterisk-mono" />
      <feComponentTransfer in="decoasterisk-mono">
        <feFuncA type="linear" slope="0.16" />
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="102" cy="188" rx="60" ry="12" fill="#000000" opacity="0.34" filter="url(#decoasterisk-drop)" />

  <g clip-path="url(#decoasterisk-clip)">
    <rect x="0" y="0" width="200" height="200" fill="url(#decoasterisk-chrome)" />
    <rect x="0" y="0" width="200" height="200" fill="url(#decoasterisk-cool)" />
    <rect x="0" y="0" width="200" height="200" fill="url(#decoasterisk-terminator)" />
    <rect x="0" y="0" width="200" height="200" fill="url(#decoasterisk-sheen)" />
    <rect x="0" y="0" width="200" height="200" filter="url(#decoasterisk-grain)" style="mix-blend-mode:overlay" />

    <!-- mirror horizon: a crisp bright line over a darker reflected half -->
    <rect x="-20" y="102" width="240" height="52" fill="#4b535f" opacity="0.34" filter="url(#decoasterisk-soft)" />
    <rect x="-20" y="97" width="240" height="4" fill="#ffffff" opacity="0.9" />
    <rect x="-20" y="94" width="240" height="10" fill="#ffffff" opacity="0.35" filter="url(#decoasterisk-tight)" />

    <!-- self shadow hugging the lower right lobes -->
    <ellipse cx="156" cy="158" rx="60" ry="48" fill="#262c35" opacity="0.45" filter="url(#decoasterisk-soft)" />

    <!-- specular hot-spot, offset from centre -->
    <ellipse cx="72" cy="52" rx="24" ry="15" fill="#ffffff" opacity="0.95" filter="url(#decoasterisk-soft)" transform="rotate(-28 72 52)" />
    <ellipse cx="66" cy="46" rx="8" ry="5" fill="#ffffff" transform="rotate(-28 66 46)" />
  </g>
</svg>
