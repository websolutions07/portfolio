    <use href="#p02b-tree" transform="translate(160 268) scale(0.42)" color="#4f7c36"/>
    <use href="#p02b-tree" transform="translate(330 270) scale(0.5)" color="#618f42"/>
    <use href="#p02b-tree" transform="translate(440 276) scale(0.46)" color="#4a7433"/>
