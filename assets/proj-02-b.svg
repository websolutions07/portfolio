        <polygon points="70,-78 77,-82 77,-104 70,-100" fill="#c9ac82"/>
        <polygon points="58,-100 72,-100 79,-104 65,-104" fill="#a8431f"/>
      </g>
      <g stroke="#c9ab7f" stroke-width="2">
