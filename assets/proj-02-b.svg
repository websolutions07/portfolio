    <use href="#p02b-tuft" transform="translate(244 448) scale(0.85)" color="#e8623a"/>
    <use href="#p02b-tuft" transform="translate(140 486) scale(1.05)" color="#f2d0d8"/>
    <use href="#p02b-tuft" transform="translate(266 490) scale(1.1)" color="#f6c22c"/>
    <use href="#p02b-tuft" transform="translate(112 528) scale(1.25)" color="#e04b8f"/>
    <use href="#p02b-tuft" transform="translate(300 536) scale(1.3)" color="#f28a2c"/>
    <use href="#p02b-tuft" transform="translate(74 576) scale(1.5)" color="#f6ecc8"/>
    <use href="#p02b-tuft" transform="translate(338 592) scale(1.55)" color="#dd4a3a"/>
  </g>

  <!-- the cart -->
  <use href="#p02b-cart" transform="translate(268 556) scale(1.22)"/>

  <!-- foreground grass -->
