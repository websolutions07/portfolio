    <path d="M-20 258C70 226 160 246 250 234 340 222 410 250 480 236L480 320-20 320Z" fill="#7b9c6a" opacity="0.9"/>
  </g>

  <path d="M0 240C110 224 240 254 460 232L460 620 0 620Z" fill="url(#p02b-ground)"/>
  <g filter="url(#p02b-organic)" opacity="0.3">
