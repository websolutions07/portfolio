<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" width="460" height="620" role="img" aria-label="Close view of a miniature 3D cottage with a terracotta roof, a garden path and a small wooden cart">
  <defs>
    <linearGradient id="p02b-sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#f6d6ef"/>
      <stop offset="0.26" stop-color="#ffd8a6"/>
      <stop offset="0.6" stop-color="#ffc37f"/>
      <stop offset="1" stop-color="#f0ad89"/>
    </linearGradient>
    <radialGradient id="p02b-sun" cx="0.82" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#fffdf0" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#ffeec0" stop-opacity="0.58"/>
      <stop offset="0.62" stop-color="#ffd9a0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
