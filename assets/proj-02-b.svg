      <path d="M27-1 27-19A6 6 0 0 1 39-19L39-1Z" fill="none" stroke="#a87445" stroke-width="1.4"/>
      <circle cx="37" cy="-9" r="1.2" fill="#f0c477"/>
      <circle cx="32" cy="-58" r="4.5" fill="url(#p02b-glow)" stroke="#c9ab7f" stroke-width="1.4"/>
    </g>

