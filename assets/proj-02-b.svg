      <circle cx="0" cy="-26" r="5" fill="currentColor"/>
      <circle cx="-11" cy="-24" r="4.2" fill="currentColor"/>
      <circle cx="10" cy="-23" r="4.4" fill="currentColor"/>
      <circle cx="1.6" cy="-27.6" r="1.8" fill="#fff6d8" opacity="0.8"/>
