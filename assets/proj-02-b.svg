    <path d="M18 452 128 452" stroke="#2c4a1e" stroke-width="7" stroke-opacity="0.3" filter="url(#p02b-shadow)"/>
    <g fill="url(#p02b-wood)">
      <path d="M22 452 22 420 27 414 32 420 32 452Z"/>
      <path d="M44 452 44 420 49 414 54 420 54 452Z"/>
      <path d="M66 452 66 420 71 414 76 420 76 452Z"/>
      <path d="M88 452 88 420 93 414 98 420 98 452Z"/>
      <path d="M110 452 110 420 115 414 120 420 120 452Z"/>
