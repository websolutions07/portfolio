<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190">
  <!-- tile-06 — gallery tile: two enormous cobalt spheres with a pearl companion -->
  <defs>
    <linearGradient id="tile06-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#d6f2ff"/>
      <stop offset="0.42" stop-color="#5aa8f2"/>
      <stop offset="1" stop-color="#081a6e"/>
    </linearGradient>
    <radialGradient id="tile06-glow" cx="20%" cy="12%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile06-cobalt" cx="32%" cy="25%" r="80%">
      <stop offset="0" stop-color="#e2f1ff"/>
      <stop offset="0.24" stop-color="#5ea8ff"/>
      <stop offset="0.68" stop-color="#0f34d8"/>
      <stop offset="1" stop-color="#030938"/>
    </radialGradient>
    <radialGradient id="tile06-electric" cx="34%" cy="26%" r="80%">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="0.26" stop-color="#3fdcff"/>
      <stop offset="0.7" stop-color="#0a63c8"/>
      <stop offset="1" stop-color="#031038"/>
    </radialGradient>
    <radialGradient id="tile06-pearl" cx="33%" cy="25%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#f0f5ff"/>
      <stop offset="0.8" stop-color="#b8c6e0"/>
      <stop offset="1" stop-color="#5a6a8c"/>
    </radialGradient>
    <radialGradient id="tile06-pink" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#ffe2f2"/>
      <stop offset="0.34" stop-color="#ff4fb0"/>
      <stop offset="0.82" stop-color="#b00b6a"/>
      <stop offset="1" stop-color="#3a0122"/>
    </radialGradient>
    <radialGradient id="tile06-bounce" cx="76%" cy="86%" r="46%">
      <stop offset="0" stop-color="#9fd8ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile06-spec">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile06-vig" cx="46%" cy="40%" r="76%">
      <stop offset="0.5" stop-color="#020829" stop-opacity="0"/>
      <stop offset="1" stop-color="#020829" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="tile06-soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="tile06-shadow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="tile06-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="61"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.42"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="280" height="190" fill="url(#tile06-bg)"/>
  <rect width="280" height="190" fill="url(#tile06-glow)"/>

  <!-- out-of-focus depth layer -->
  <g filter="url(#tile06-soft)" opacity="0.75">
    <circle cx="36" cy="34" r="30" fill="#8fd8ff"/>
    <circle cx="230" cy="30" r="26" fill="#2f6cf5"/>
    <circle cx="150" cy="186" r="36" fill="#0f34d8" opacity="0.8"/>
  </g>

  <!-- pearl sphere behind -->
  <ellipse cx="216" cy="118" rx="34" ry="9" fill="#061448" opacity="0.4" filter="url(#tile06-shadow)"/>
  <g>
    <circle cx="214" cy="80" r="38" fill="url(#tile06-pearl)"/>
    <ellipse cx="199" cy="63" rx="9.6" ry="6.4" fill="url(#tile06-spec)" transform="rotate(-30 199 63)"/>
    <ellipse cx="195" cy="59" rx="3" ry="1.9" fill="#ffffff" opacity="0.95" transform="rotate(-30 195 59)"/>
  </g>

  <!-- electric-blue sphere -->
  <ellipse cx="206" cy="188" rx="46" ry="12" fill="#020a30" opacity="0.45" filter="url(#tile06-shadow)"/>
  <g>
    <circle cx="204" cy="146" r="52" fill="url(#tile06-electric)"/>
    <circle cx="204" cy="146" r="52" fill="url(#tile06-bounce)"/>
    <ellipse cx="183" cy="123" rx="13.5" ry="9" fill="url(#tile06-spec)" transform="rotate(-30 183 123)"/>
    <ellipse cx="178" cy="118" rx="4.2" ry="2.7" fill="#ffffff" opacity="0.92" transform="rotate(-30 178 118)"/>
  </g>

  <!-- cobalt hero sphere -->
  <ellipse cx="76" cy="176" rx="60" ry="15" fill="#03093a" opacity="0.45" filter="url(#tile06-shadow)"/>
  <g>
    <circle cx="74" cy="104" r="66" fill="url(#tile06-cobalt)"/>
    <circle cx="74" cy="104" r="66" fill="url(#tile06-bounce)"/>
    <ellipse cx="47" cy="74" rx="17.5" ry="11.5" fill="url(#tile06-spec)" transform="rotate(-28 47 74)"/>
    <ellipse cx="40" cy="67" rx="5.6" ry="3.5" fill="#ffffff" opacity="0.94" transform="rotate(-28 40 67)"/>
  </g>

  <!-- hot-pink accent beads -->
  <g>
    <circle cx="146" cy="46" r="15" fill="url(#tile06-pink)"/>
    <ellipse cx="140" cy="40" rx="4" ry="2.6" fill="#ffffff" opacity="0.88" transform="rotate(-30 140 40)"/>
    <circle cx="150" cy="120" r="9" fill="url(#tile06-pink)"/>
    <circle cx="262" cy="152" r="11" fill="url(#tile06-pink)"/>
    <circle cx="26" cy="180" r="7" fill="url(#tile06-pink)"/>
  </g>

  <!-- defocused foreground bead -->
  <circle cx="264" cy="26" r="18" fill="#3fdcff" opacity="0.5" filter="url(#tile06-shadow)"/>

  <rect width="280" height="190" fill="url(#tile06-vig)"/>
  <rect width="280" height="190" filter="url(#tile06-grain)" opacity="0.3" style="mix-blend-mode:overlay"/>
</svg>
