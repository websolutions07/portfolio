<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Smiling face with hearts emoji">
  <defs>
    <clipPath id="decoemojihearts-face-clip">
      <circle cx="98" cy="112" r="66" />
    </clipPath>

    <radialGradient id="decoemojihearts-face" cx="64" cy="70" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6c0" />
      <stop offset="0.22" stop-color="#ffe167" />
      <stop offset="0.5" stop-color="#fdc61f" />
      <stop offset="0.78" stop-color="#e79a05" />
      <stop offset="1" stop-color="#a86200" />
    </radialGradient>

    <radialGradient id="decoemojihearts-deep" cx="146" cy="166" r="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a4b00" stop-opacity="0.7" />
      <stop offset="0.6" stop-color="#b06a00" stop-opacity="0.22" />
      <stop offset="1" stop-color="#b06a00" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="decoemojihearts-heart" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ff8c86" />
      <stop offset="0.35" stop-color="#f8324a" />
      <stop offset="1" stop-color="#a80a24" />
    </linearGradient>

    <filter id="decoemojihearts-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" />
    </filter>

    <filter id="decoemojihearts-tight" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.6" />
    </filter>

    <filter id="decoemojihearts-drop" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <filter id="decoemojihearts-grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="3" seed="149" result="decoemojihearts-noise" />
      <feColorMatrix in="decoemojihearts-noise" type="saturate" values="0" result="decoemojihearts-mono" />
      <feComponentTransfer in="decoemojihearts-mono">
        <feFuncA type="linear" slope="0.12" />
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="100" cy="188" rx="52" ry="9" fill="#000000" opacity="0.34" filter="url(#decoemojihearts-drop)" />
  <ellipse cx="98" cy="186" rx="34" ry="6" fill="#e0a300" opacity="0.32" filter="url(#decoemojihearts-drop)" />

  <!-- face -->
  <circle cx="98" cy="112" r="66" fill="url(#decoemojihearts-face)" />

  <g clip-path="url(#decoemojihearts-face-clip)">
    <rect x="0" y="0" width="200" height="200" fill="url(#decoemojihearts-deep)" />
    <!-- soft self shadow low right -->
    <ellipse cx="142" cy="158" rx="46" ry="36" fill="#8a4b00" opacity="0.34" filter="url(#decoemojihearts-soft)" />
    <!-- rim light on the shadow side -->
    <path d="M164 112 A66 66 0 0 1 112 177" fill="none" stroke="#ffd977" stroke-opacity="0.55" stroke-width="8" filter="url(#decoemojihearts-soft)" />
    <rect x="0" y="0" width="200" height="200" filter="url(#decoemojihearts-grain)" style="mix-blend-mode:overlay" />
  </g>

  <!-- closed happy eyes -->
  <g fill="none" stroke="#6b4300" stroke-width="8" stroke-linecap="round">
    <path d="M64 112 Q78 94 92 112" />
    <path d="M108 112 Q122 94 136 112" />
  </g>

  <!-- warm smile -->
  <path d="M72 136 Q98 162 124 136" fill="none" stroke="#6b4300" stroke-width="8" stroke-linecap="round" />

  <!-- rosy cheeks -->
  <ellipse cx="60" cy="134" rx="13" ry="8" fill="#ff8f6a" opacity="0.45" filter="url(#decoemojihearts-tight)" />
  <ellipse cx="140" cy="134" rx="13" ry="8" fill="#ff8f6a" opacity="0.38" filter="url(#decoemojihearts-tight)" />

  <!-- glossy specular hot-spot, offset up-left -->
  <ellipse cx="66" cy="72" rx="24" ry="14" fill="#ffffff" opacity="0.6" filter="url(#decoemojihearts-soft)" transform="rotate(-30 66 72)" />
  <ellipse cx="60" cy="66" rx="8" ry="4.5" fill="#ffffff" opacity="0.9" transform="rotate(-30 60 66)" />

  <!-- three hearts floating around the head -->
  <g>
    <g transform="translate(18 20) rotate(-18) scale(1.05)">
      <path d="M20 37 C6 27 1 19 1 12.5 C1 5.5 6 1 12 1 C16 1 19 3.5 20 6 C21 3.5 24 1 28 1 C34 1 39 5.5 39 12.5 C39 19 34 27 20 37 Z" fill="url(#decoemojihearts-heart)" />
      <ellipse cx="12" cy="11" rx="5" ry="3.2" fill="#ffffff" opacity="0.75" transform="rotate(-28 12 11)" />
    </g>
    <g transform="translate(146 30) rotate(16) scale(0.85)">
      <path d="M20 37 C6 27 1 19 1 12.5 C1 5.5 6 1 12 1 C16 1 19 3.5 20 6 C21 3.5 24 1 28 1 C34 1 39 5.5 39 12.5 C39 19 34 27 20 37 Z" fill="url(#decoemojihearts-heart)" />
      <ellipse cx="12" cy="11" rx="5" ry="3.2" fill="#ffffff" opacity="0.7" transform="rotate(-28 12 11)" />
    </g>
    <g transform="translate(160 92) rotate(28) scale(0.66)">
      <path d="M20 37 C6 27 1 19 1 12.5 C1 5.5 6 1 12 1 C16 1 19 3.5 20 6 C21 3.5 24 1 28 1 C34 1 39 5.5 39 12.5 C39 19 34 27 20 37 Z" fill="url(#decoemojihearts-heart)" />
      <ellipse cx="12" cy="11" rx="5" ry="3.2" fill="#ffffff" opacity="0.7" transform="rotate(-28 12 11)" />
    </g>
  </g>
</svg>
