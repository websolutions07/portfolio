<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190">
  <!-- tile-09 — gallery tile: one giant blood-orange sphere in warm bokeh -->
  <defs>
    <linearGradient id="tile09-bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.5" stop-color="#f2712a"/>
      <stop offset="1" stop-color="#5a0d07"/>
    </linearGradient>
    <radialGradient id="tile09-glow" cx="26%" cy="18%" r="66%">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile09-hero" cx="31%" cy="24%" r="80%">
      <stop offset="0" stop-color="#ffe3c6"/>
      <stop offset="0.2" stop-color="#ff9a4a"/>
      <stop offset="0.58" stop-color="#ef3d15"/>
      <stop offset="0.86" stop-color="#96110a"/>
      <stop offset="1" stop-color="#3d0407"/>
    </radialGradient>
    <radialGradient id="tile09-rim" cx="74%" cy="82%" r="48%">
      <stop offset="0" stop-color="#ffcf6a" stop-opacity="0.6"/>
      <stop offset="0.7" stop-color="#ff8a2a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile09-yolk" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#fffad0"/>
      <stop offset="0.32" stop-color="#ffcb14"/>
      <stop offset="0.8" stop-color="#c47404"/>
      <stop offset="1" stop-color="#472301"/>
    </radialGradient>
    <radialGradient id="tile09-tang" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#ffdcb4"/>
      <stop offset="0.34" stop-color="#ff7a1a"/>
      <stop offset="0.82" stop-color="#b23c05"/>
      <stop offset="1" stop-color="#3d1201"/>
    </radialGradient>
    <radialGradient id="tile09-spec">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile09-vig" cx="42%" cy="36%" r="80%">
      <stop offset="0.46" stop-color="#3a0503" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a0503" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="tile09-bokeh" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="tile09-soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="tile09-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" seed="97"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.46"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="280" height="190" fill="url(#tile09-bg)"/>
  <rect width="280" height="190" fill="url(#tile09-glow)"/>

  <!-- bokeh field -->
  <g filter="url(#tile09-bokeh)">
    <circle cx="36" cy="34" r="30" fill="#ffe07a" opacity="0.9"/>
    <circle cx="92" cy="22" r="20" fill="#fff2c0" opacity="0.75"/>
    <circle cx="240" cy="44" r="34" fill="#ff9d3d" opacity="0.85"/>
    <circle cx="266" cy="120" r="24" fill="#ffd166" opacity="0.7"/>
    <circle cx="150" cy="180" r="30" fill="#c02a08" opacity="0.85"/>
    <circle cx="24" cy="140" r="26" fill="#ff7a1a" opacity="0.7"/>
  </g>

  <!-- giant hero sphere, off centre right -->
  <ellipse cx="176" cy="182" rx="76" ry="18" fill="#3d0407" opacity="0.5" filter="url(#tile09-soft)"/>
  <g>
    <circle cx="172" cy="104" r="82" fill="url(#tile09-hero)"/>
    <circle cx="172" cy="104" r="82" fill="url(#tile09-rim)"/>
    <ellipse cx="138" cy="66" rx="22" ry="14" fill="url(#tile09-spec)" transform="rotate(-28 138 66)"/>
    <ellipse cx="129" cy="57" rx="6.8" ry="4.2" fill="#ffffff" opacity="0.95" transform="rotate(-28 129 57)"/>
    <ellipse cx="206" cy="158" rx="26" ry="11" fill="#ffb04a" opacity="0.22" transform="rotate(-30 206 158)"/>
  </g>

  <!-- warm accent beads -->
  <g>
    <ellipse cx="56" cy="112" rx="24" ry="6" fill="#4a0805" opacity="0.4" filter="url(#tile09-soft)"/>
    <circle cx="54" cy="94" r="22" fill="url(#tile09-yolk)"/>
    <ellipse cx="45" cy="85" rx="5.6" ry="3.7" fill="url(#tile09-spec)" transform="rotate(-30 45 85)"/>
    <ellipse cx="42" cy="82" rx="2" ry="1.3" fill="#ffffff" opacity="0.95" transform="rotate(-30 42 82)"/>

    <circle cx="34" cy="164" r="14" fill="url(#tile09-tang)"/>
    <ellipse cx="28" cy="158" rx="3.6" ry="2.4" fill="#ffffff" opacity="0.85" transform="rotate(-30 28 158)"/>

    <circle cx="86" cy="146" r="9" fill="url(#tile09-yolk)"/>
    <circle cx="252" cy="176" r="12" fill="url(#tile09-yolk)"/>
    <circle cx="108" cy="26" r="8" fill="url(#tile09-tang)"/>
  </g>

  <rect width="280" height="190" fill="url(#tile09-vig)"/>
  <rect width="280" height="190" filter="url(#tile09-grain)" opacity="0.3" style="mix-blend-mode:overlay"/>
</svg>
