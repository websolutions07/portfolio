<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" role="img"
     aria-label="Abstract liquid colour render in hot orange and amber">
  <defs>
    <linearGradient id="p03b-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1002"/>
      <stop offset="45%" stop-color="#8a2c04"/>
      <stop offset="100%" stop-color="#1e0701"/>
    </linearGradient>

    <linearGradient id="p03b-ribbon-a" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="35%" stop-color="#ffa722"/>
      <stop offset="72%" stop-color="#f0490d"/>
      <stop offset="100%" stop-color="#a41f02"/>
    </linearGradient>

    <linearGradient id="p03b-ribbon-b" x1="10%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#c23205"/>
      <stop offset="40%" stop-color="#ff7a18"/>
      <stop offset="78%" stop-color="#ffefc0"/>
      <stop offset="100%" stop-color="#ffd070"/>
    </linearGradient>

    <linearGradient id="p03b-ribbon-c" x1="0%" y1="20%" x2="100%" y2="95%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="50%" stop-color="#ffcf7d"/>
      <stop offset="100%" stop-color="#e5591a"/>
    </linearGradient>

    <radialGradient id="p03b-pool" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#fff6dc"/>
      <stop offset="45%" stop-color="#ffab2e"/>
      <stop offset="100%" stop-color="#a82d05"/>
    </radialGradient>

    <radialGradient id="p03b-bead" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffd58f"/>
      <stop offset="100%" stop-color="#c73f06"/>
    </radialGradient>

    <filter id="p03b-goo" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="3" seed="41"
                    result="p03b-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="p03b-noise" scale="30"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="p03b-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="p03b-blur-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="p03b-frame">
      <rect width="460" height="620"/>
    </clipPath>
  </defs>

  <g clip-path="url(#p03b-frame)">
    <rect width="460" height="620" fill="url(#p03b-bg)"/>

    <ellipse cx="150" cy="170" rx="200" ry="170" fill="#ff7a12" opacity=".5" filter="url(#p03b-blur)"/>
    <ellipse cx="350" cy="480" rx="200" ry="180" fill="#ffb62e" opacity=".42" filter="url(#p03b-blur)"/>

    <g filter="url(#p03b-goo)">
      <path d="M-40 440 C 80 340 160 470 260 400 C 360 330 420 430 500 360 L 500 700 L -40 700 Z"
            fill="url(#p03b-ribbon-a)" opacity=".95"/>
      <path d="M-40 290 C 70 210 170 320 270 240 C 370 160 430 260 500 200"
            fill="none" stroke="url(#p03b-ribbon-b)" stroke-width="76" stroke-linecap="round"
            opacity=".92"/>
      <path d="M-30 540 C 90 470 180 570 300 500 C 400 442 450 520 500 480"
            fill="none" stroke="url(#p03b-ribbon-c)" stroke-width="38" stroke-linecap="round"
            opacity=".82"/>
      <path d="M90 620 C 140 480 240 510 280 380 C 316 262 370 250 400 140"
            fill="none" stroke="#ffe2a0" stroke-width="22" stroke-linecap="round" opacity=".55"/>
    </g>

    <ellipse cx="200" cy="320" rx="150" ry="130" fill="url(#p03b-pool)" opacity=".9"
             filter="url(#p03b-goo)"/>

    <path d="M90 200 C 160 150 230 168 300 128" fill="none" stroke="#fffdf5" stroke-width="11"
          stroke-linecap="round" opacity=".55" filter="url(#p03b-blur-sm)"/>
    <path d="M250 440 C 320 404 370 420 440 386" fill="none" stroke="#fffdf5" stroke-width="8"
          stroke-linecap="round" opacity=".38" filter="url(#p03b-blur-sm)"/>

    <circle cx="332" cy="180" r="50" fill="url(#p03b-bead)"/>
    <circle cx="316" cy="163" r="14" fill="#ffffff" opacity=".85"/>
    <circle cx="112" cy="470" r="36" fill="url(#p03b-bead)"/>
    <circle cx="102" cy="458" r="10" fill="#ffffff" opacity=".8"/>
    <circle cx="404" cy="96" r="21" fill="url(#p03b-bead)"/>
    <circle cx="248" cy="548" r="27" fill="url(#p03b-bead)"/>
    <circle cx="241" cy="539" r="7" fill="#ffffff" opacity=".8"/>
    <circle cx="66" cy="264" r="12" fill="#fff2d0" opacity=".75"/>
    <circle cx="382" cy="308" r="15" fill="#fff2d0" opacity=".8"/>

    <ellipse cx="230" cy="310" rx="290" ry="400" fill="none" stroke="#180500" stroke-width="150"
             opacity=".5" filter="url(#p03b-blur)"/>
  </g>
</svg>
