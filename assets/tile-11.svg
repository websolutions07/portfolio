<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" width="280" height="190">
  <!-- tile-11 — gallery tile: soft organic green blobs with cream folds -->
  <defs>
    <linearGradient id="tile11-bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6ffe0"/>
      <stop offset="0.45" stop-color="#a8e84a"/>
      <stop offset="1" stop-color="#0f4a22"/>
    </linearGradient>
    <radialGradient id="tile11-glow" cx="22%" cy="14%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile11-blobA" cx="30%" cy="24%" r="82%">
      <stop offset="0" stop-color="#f4ffc8"/>
      <stop offset="0.26" stop-color="#bdf53a"/>
      <stop offset="0.68" stop-color="#4f9c0e"/>
      <stop offset="1" stop-color="#123a04"/>
    </radialGradient>
    <radialGradient id="tile11-blobB" cx="32%" cy="24%" r="82%">
      <stop offset="0" stop-color="#e4fff0"/>
      <stop offset="0.28" stop-color="#3ce8a0"/>
      <stop offset="0.7" stop-color="#0b8256"/>
      <stop offset="1" stop-color="#02261a"/>
    </radialGradient>
    <radialGradient id="tile11-blobC" cx="32%" cy="24%" r="82%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.34" stop-color="#fbf7dc"/>
      <stop offset="0.78" stop-color="#c6c092"/>
      <stop offset="1" stop-color="#5c5a34"/>
    </radialGradient>
    <radialGradient id="tile11-bead" cx="34%" cy="27%" r="76%">
      <stop offset="0" stop-color="#d6e6ff"/>
      <stop offset="0.34" stop-color="#2f66f5"/>
      <stop offset="0.82" stop-color="#0c2296"/>
      <stop offset="1" stop-color="#040a34"/>
    </radialGradient>
    <radialGradient id="tile11-spec">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile11-vig" cx="46%" cy="40%" r="76%">
      <stop offset="0.52" stop-color="#092a10" stop-opacity="0"/>
      <stop offset="1" stop-color="#092a10" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="tile11-organic" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.012" numOctaves="2" seed="13" result="tile11-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="tile11-noise" scale="20" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="tile11-soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="tile11-shadow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="tile11-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" seed="109"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.44"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="280" height="190" fill="url(#tile11-bg)"/>
  <rect width="280" height="190" fill="url(#tile11-glow)"/>

  <!-- out-of-focus mass -->
  <g filter="url(#tile11-soft)" opacity="0.75">
    <ellipse cx="220" cy="34" rx="60" ry="34" fill="#dcff96"/>
    <ellipse cx="40" cy="170" rx="56" ry="34" fill="#0b8256"/>
  </g>

  <!-- soft organic blobs -->
  <g filter="url(#tile11-organic)">
    <ellipse cx="88" cy="72" rx="66" ry="52" fill="url(#tile11-blobA)"/>
    <ellipse cx="196" cy="118" rx="72" ry="58" fill="url(#tile11-blobB)"/>
    <ellipse cx="118" cy="152" rx="58" ry="40" fill="url(#tile11-blobC)"/>
    <ellipse cx="246" cy="46" rx="44" ry="34" fill="url(#tile11-blobA)"/>
    <ellipse cx="24" cy="120" rx="38" ry="30" fill="url(#tile11-blobB)"/>
  </g>

  <!-- highlight sheen on the blob crests -->
  <g filter="url(#tile11-soft)" opacity="0.5">
    <ellipse cx="66" cy="46" rx="34" ry="16" fill="#fbffdc" transform="rotate(-18 66 46)"/>
    <ellipse cx="172" cy="92" rx="30" ry="13" fill="#d2ffe8" transform="rotate(-20 172 92)"/>
  </g>

  <!-- glossy beads resting between the blobs -->
  <g>
    <ellipse cx="152" cy="72" rx="22" ry="6" fill="#0c3a16" opacity="0.4" filter="url(#tile11-shadow)"/>
    <circle cx="150" cy="56" r="20" fill="url(#tile11-bead)"/>
    <ellipse cx="141" cy="48" rx="5" ry="3.4" fill="url(#tile11-spec)" transform="rotate(-30 141 48)"/>
    <ellipse cx="138" cy="45" rx="1.9" ry="1.2" fill="#ffffff" opacity="0.95" transform="rotate(-30 138 45)"/>

    <circle cx="228" cy="164" r="14" fill="url(#tile11-bead)"/>
    <ellipse cx="222" cy="158" rx="3.6" ry="2.4" fill="#ffffff" opacity="0.85" transform="rotate(-30 222 158)"/>

    <circle cx="58" cy="118" r="11" fill="url(#tile11-blobC)"/>
    <circle cx="266" cy="106" r="9" fill="url(#tile11-bead)"/>
    <circle cx="98" cy="24" r="8" fill="url(#tile11-blobC)"/>
    <circle cx="172" cy="182" r="10" fill="url(#tile11-blobA)"/>
  </g>

  <!-- defocused foreground blob -->
  <ellipse cx="18" cy="34" rx="26" ry="20" fill="#bdf53a" opacity="0.5" filter="url(#tile11-shadow)"/>

  <rect width="280" height="190" fill="url(#tile11-vig)"/>
  <rect width="280" height="190" filter="url(#tile11-grain)" opacity="0.3" style="mix-blend-mode:overlay"/>
</svg>
