<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Glossy purple torus knot">
  <defs>
    <linearGradient id="decoknot-tube" x1="34" y1="26" x2="168" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9a9ff" />
      <stop offset="0.2" stop-color="#b273f4" />
      <stop offset="0.48" stop-color="#8a3ce2" />
      <stop offset="0.76" stop-color="#5f1cb4" />
      <stop offset="1" stop-color="#3a0c74" />
    </linearGradient>

    <linearGradient id="decoknot-gloss" x1="46" y1="30" x2="150" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="0.72" stop-color="#1e0548" stop-opacity="0.35" />
      <stop offset="1" stop-color="#1e0548" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="decoknot-rimlight" x1="176" y1="132" x2="96" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff74dd" stop-opacity="0.6" />
      <stop offset="1" stop-color="#ff74dd" stop-opacity="0" />
    </linearGradient>

    <filter id="decoknot-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <filter id="decoknot-tight" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.4" />
    </filter>

    <filter id="decoknot-drop" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>

  </defs>

  <!-- contact shadow -->
  <ellipse cx="102" cy="190" rx="56" ry="10" fill="#000000" opacity="0.34" filter="url(#decoknot-drop)" />
  <ellipse cx="100" cy="187" rx="34" ry="6" fill="#7b2fd6" opacity="0.3" filter="url(#decoknot-drop)" />

  <g fill="none" stroke-linecap="round">
    <!-- loop 1 -->
    <g>
      <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="#240857" stroke-width="35" />
      <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="url(#decoknot-tube)" stroke-width="28" />
      <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="url(#decoknot-gloss)" stroke-width="28" />
      <g transform="translate(-3.5 -4.5)">
        <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="#ffffff" stroke-opacity="0.32" stroke-width="7" filter="url(#decoknot-tight)" />
      </g>
    </g>

    <!-- loop 2 -->
    <g transform="rotate(60 100 100)">
      <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="#240857" stroke-width="35" />
      <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="url(#decoknot-tube)" stroke-width="28" />
      <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="url(#decoknot-gloss)" stroke-width="28" />
      <g transform="translate(-3.5 -4.5)">
        <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="#ffffff" stroke-opacity="0.32" stroke-width="7" filter="url(#decoknot-tight)" />
      </g>
    </g>

    <!-- loop 3 -->
    <g transform="rotate(120 100 100)">
      <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="#240857" stroke-width="35" />
      <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="url(#decoknot-tube)" stroke-width="28" />
      <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="url(#decoknot-gloss)" stroke-width="28" />
      <g transform="translate(-3.5 -4.5)">
        <path d="M138 100 A38 72 0 0 1 62 100 A38 72 0 0 1 138 100" stroke="#ffffff" stroke-opacity="0.32" stroke-width="7" filter="url(#decoknot-tight)" />
      </g>
    </g>

    <!-- loop 1 crosses back over loop 3: the strand that makes it interlock -->
    <g>
      <path d="M62 100 A38 72 0 0 1 138 100" stroke="#240857" stroke-width="35" />
      <path d="M62 100 A38 72 0 0 1 138 100" stroke="url(#decoknot-tube)" stroke-width="28" />
      <path d="M62 100 A38 72 0 0 1 138 100" stroke="url(#decoknot-gloss)" stroke-width="28" />
      <g transform="translate(-3.5 -4.5)">
        <path d="M62 100 A38 72 0 0 1 138 100" stroke="#ffffff" stroke-opacity="0.32" stroke-width="7" filter="url(#decoknot-tight)" />
      </g>
    </g>

    <!-- loop 2 crosses back over loop 1 -->
    <g transform="rotate(60 100 100)">
      <path d="M62 100 A38 72 0 0 1 138 100" stroke="#240857" stroke-width="35" />
      <path d="M62 100 A38 72 0 0 1 138 100" stroke="url(#decoknot-tube)" stroke-width="28" />
      <path d="M62 100 A38 72 0 0 1 138 100" stroke="url(#decoknot-gloss)" stroke-width="28" />
      <g transform="translate(-3.5 -4.5)">
        <path d="M62 100 A38 72 0 0 1 138 100" stroke="#ffffff" stroke-opacity="0.32" stroke-width="7" filter="url(#decoknot-tight)" />
      </g>
    </g>

    <!-- warm rim light picked up along the lower right tubes -->
    <path d="M138 100 A38 72 0 0 1 62 100" stroke="url(#decoknot-rimlight)" stroke-width="26" />
  </g>

  <!-- specular hot-spots offset up-left -->
  <ellipse cx="72" cy="48" rx="11" ry="6" fill="#ffffff" opacity="0.85" filter="url(#decoknot-tight)" transform="rotate(-38 72 48)" />
  <ellipse cx="126" cy="60" rx="7" ry="4" fill="#ffffff" opacity="0.5" filter="url(#decoknot-tight)" transform="rotate(34 126 60)" />
</svg>
