<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" id="ch"
     role="img" aria-label="Stylised 3D portrait of Alex">
  <defs>
    <radialGradient id="ch-skin" cx="40%" cy="24%" r="84%">
      <stop offset="0%" stop-color="#cd9265"/>
      <stop offset="40%" stop-color="#b0744a"/>
      <stop offset="74%" stop-color="#8d5834"/>
      <stop offset="100%" stop-color="#603921"/>
    </radialGradient>

    <radialGradient id="ch-skin-ear" cx="40%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#c08554"/>
      <stop offset="60%" stop-color="#96623b"/>
      <stop offset="100%" stop-color="#5c3620"/>
    </radialGradient>

    <linearGradient id="ch-neck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#663c23"/>
      <stop offset="50%" stop-color="#8a5533"/>
      <stop offset="100%" stop-color="#a86c41"/>
    </linearGradient>

    <linearGradient id="ch-hair" x1="24%" y1="4%" x2="76%" y2="96%">
      <stop offset="0%" stop-color="#3d332d"/>
      <stop offset="38%" stop-color="#241d1a"/>
      <stop offset="100%" stop-color="#0c0908"/>
    </linearGradient>

    <linearGradient id="ch-beard" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#332a25"/>
      <stop offset="45%" stop-color="#1d1714"/>
      <stop offset="100%" stop-color="#0b0807"/>
    </linearGradient>

    <linearGradient id="ch-tee" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#f1efea"/>
      <stop offset="100%" stop-color="#cdcac2"/>
    </linearGradient>

    <radialGradient id="ch-iris" cx="38%" cy="30%" r="74%">
      <stop offset="0%" stop-color="#a3733f"/>
      <stop offset="44%" stop-color="#6d4726"/>
      <stop offset="100%" stop-color="#2c1b0f"/>
    </radialGradient>

    <radialGradient id="ch-sclera-g" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="70%" stop-color="#f3ebe2"/>
      <stop offset="100%" stop-color="#d2bfae"/>
    </radialGradient>

    <linearGradient id="ch-lip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7d4732"/>
      <stop offset="55%" stop-color="#a25f44"/>
      <stop offset="100%" stop-color="#844a35"/>
    </linearGradient>

    <pattern id="ch-coil" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="5.5" cy="5.5" r="5.5" fill="#352c26" opacity=".9"/>
      <circle cx="16.5" cy="15" r="5" fill="#2a221e" opacity=".85"/>
      <circle cx="5.5" cy="5.5" r="2.3" fill="#4a3e35" opacity=".75"/>
      <circle cx="16.5" cy="15" r="2" fill="#3f342c" opacity=".6"/>
    </pattern>

    <pattern id="ch-coil-fine" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="3.2" cy="3.2" r="3.2" fill="#2e2622" opacity=".85"/>
      <circle cx="9.8" cy="9" r="2.8" fill="#241d19" opacity=".8"/>
      <circle cx="3.2" cy="3.2" r="1.2" fill="#43382f" opacity=".65"/>
    </pattern>

    <filter id="ch-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="ch-soft-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ch-soft-xs" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="ch-head-clip">
      <path d="M360 175 C 474 175 522 250 528 344 C 534 414 528 476 512 536
               C 494 600 442 638 360 644 C 278 638 226 600 208 536
               C 192 476 186 414 192 344 C 198 250 246 175 360 175 Z"/>
    </clipPath>

    <clipPath id="ch-hair-clip">
      <path d="M186 330 C 170 226 202 138 272 100 C 314 76 358 68 400 70
               C 468 74 524 106 550 166 C 572 216 570 278 556 330
               C 548 292 534 268 518 252 C 494 284 444 296 388 292
               C 330 288 278 280 236 258 C 212 272 194 298 186 330 Z"/>
    </clipPath>

    <clipPath id="ch-beard-clip">
      <path d="M196 356 C 198 448 212 538 242 590 C 272 642 314 668 360 670
               C 406 668 448 642 478 590 C 508 538 522 448 524 356
               C 514 430 496 482 464 514 C 440 538 416 556 388 562
               C 371 566 349 566 332 562 C 304 556 280 538 256 514
               C 224 482 206 430 196 356 Z"/>
    </clipPath>

    <clipPath id="ch-eye-l-clip">
      <path d="M238 390 C 248 364 270 354 288 354 C 310 354 330 368 334 390
               C 326 414 306 424 288 424 C 266 424 246 412 238 390 Z"/>
    </clipPath>
    <clipPath id="ch-eye-r-clip">
      <path d="M386 390 C 390 368 410 354 432 354 C 450 354 472 364 482 390
               C 474 412 454 424 432 424 C 414 424 394 414 386 390 Z"/>
    </clipPath>
  </defs>

  <g id="ch-root">

    <!-- ==================== body ==================== -->
    <g id="ch-body">
      <path d="M290 560 L290 668 C290 708 320 728 360 730 C400 728 430 708 430 668
               L430 560 Z" fill="url(#ch-neck)"/>
      <path d="M290 564 q70 50 140 0 l0 46 q-70 44 -140 0 Z" fill="#4f2e1b" opacity=".55"
            filter="url(#ch-soft-sm)"/>

      <path d="M360 712 C286 712 224 734 168 768 C96 812 44 858 18 900
               L702 900 C676 858 624 812 552 768 C496 734 434 712 360 712 Z"
            fill="url(#ch-tee)"/>
      <path d="M276 718 C298 772 422 772 444 718 C416 704 304 704 276 718 Z"
            fill="#c6c2b9" opacity=".9"/>
      <path d="M280 716 C302 764 418 764 440 716" fill="none" stroke="#b3afa5"
            stroke-width="6" stroke-linecap="round" opacity=".85"/>
      <path d="M140 800 C186 850 236 878 292 894" fill="none" stroke="#d9d6ce"
            stroke-width="11" stroke-linecap="round" opacity=".5" filter="url(#ch-soft-xs)"/>
      <path d="M580 800 C534 850 484 878 428 894" fill="none" stroke="#bfbbb2"
            stroke-width="11" stroke-linecap="round" opacity=".5" filter="url(#ch-soft-xs)"/>
      <ellipse cx="360" cy="754" rx="140" ry="30" fill="#8b8882" opacity=".35"
               filter="url(#ch-soft)"/>
    </g>

    <!-- ==================== head ==================== -->
    <g id="ch-head">

      <ellipse cx="196" cy="420" rx="29" ry="45" fill="url(#ch-skin-ear)"/>
      <ellipse cx="524" cy="420" rx="29" ry="45" fill="url(#ch-skin-ear)"/>
      <path d="M196 402 c-9 6 -11 24 -3 38" fill="none" stroke="#6e4227" stroke-width="6"
            stroke-linecap="round" opacity=".6"/>
      <path d="M524 402 c9 6 11 24 3 38" fill="none" stroke="#6e4227" stroke-width="6"
            stroke-linecap="round" opacity=".6"/>

      <path d="M360 175 C 474 175 522 250 528 344 C 534 414 528 476 512 536
               C 494 600 442 638 360 644 C 278 638 226 600 208 536
               C 192 476 186 414 192 344 C 198 250 246 175 360 175 Z"
            fill="url(#ch-skin)"/>

      <g clip-path="url(#ch-head-clip)">
        <ellipse cx="548" cy="420" rx="76" ry="180" fill="#5c3620" opacity=".38"
                 filter="url(#ch-soft)"/>
        <ellipse cx="258" cy="452" rx="62" ry="50" fill="#c98d5e" opacity=".32"
                 filter="url(#ch-soft)"/>
        <ellipse cx="462" cy="452" rx="62" ry="50" fill="#bd8153" opacity=".24"
                 filter="url(#ch-soft)"/>
        <ellipse cx="360" cy="292" rx="122" ry="50" fill="#d69f70" opacity=".3"
                 filter="url(#ch-soft)"/>
        <path d="M150 200 h430 c-8 70 -76 102 -215 102 c-135 0 -200 -32 -215 -102 Z"
              fill="#5e3720" opacity=".3" filter="url(#ch-soft)"/>
      </g>

      <!-- ==================== beard ==================== -->
      <g id="ch-beard">
        <path d="M196 356 C 198 448 212 538 242 590 C 272 642 314 668 360 670
                 C 406 668 448 642 478 590 C 508 538 522 448 524 356
                 C 514 430 496 482 464 514 C 440 538 416 556 388 562
                 C 371 566 349 566 332 562 C 304 556 280 538 256 514
                 C 224 482 206 430 196 356 Z"
              fill="url(#ch-beard)"/>
        <g clip-path="url(#ch-beard-clip)">
          <rect x="170" y="340" width="390" height="350" fill="url(#ch-coil-fine)" opacity=".6"/>
          <ellipse cx="286" cy="500" rx="76" ry="66" fill="#4a3e35" opacity=".22"
                   filter="url(#ch-soft)"/>
          <ellipse cx="360" cy="644" rx="94" ry="38" fill="#050404" opacity=".5"
                   filter="url(#ch-soft)"/>
          <ellipse cx="486" cy="500" rx="60" ry="80" fill="#050404" opacity=".35"
                   filter="url(#ch-soft)"/>
        </g>
        <!-- soft edge where the beard meets the cheek -->
        <path d="M204 380 C 214 452 234 500 262 524" fill="none" stroke="#2b231f"
              stroke-width="16" stroke-linecap="round" opacity=".5" filter="url(#ch-soft-sm)"/>
        <path d="M516 380 C 506 452 486 500 458 524" fill="none" stroke="#2b231f"
              stroke-width="16" stroke-linecap="round" opacity=".5" filter="url(#ch-soft-sm)"/>
        <path d="M198 320 c-4 32 0 58 8 76 c6 -28 12 -52 22 -68 Z" fill="url(#ch-hair)"/>
        <path d="M522 320 c4 32 0 58 -8 76 c-6 -28 -12 -52 -22 -68 Z" fill="url(#ch-hair)"/>
      </g>

      <!-- ==================== brows ==================== -->
      <g id="ch-brows">
        <g id="ch-brow-l" fill="#171211">
          <path d="M228 336 c28 -24 78 -30 114 -10 c8 5 10 15 4 21 c-5 5 -13 4 -19 1
                   c-28 -14 -64 -10 -89 8 c-9 6 -18 4 -21 -3 c-3 -7 4 -12 11 -17 Z"/>
          <path d="M230 330 c32 -25 82 -29 116 -8 l0 25 c-34 -19 -78 -15 -106 2 Z"/>
        </g>
        <g id="ch-brow-r" fill="#171211">
          <path d="M492 336 c-28 -24 -78 -30 -114 -10 c-8 5 -10 15 -4 21 c5 5 13 4 19 1
                   c28 -14 64 -10 89 8 c9 6 18 4 21 -3 c3 -7 -4 -12 -11 -17 Z"/>
          <path d="M490 330 c-32 -25 -82 -29 -116 -8 l0 25 c34 -19 78 -15 106 2 Z"/>
        </g>
      </g>

      <!-- ==================== eyes ==================== -->
      <g id="ch-eyes">
        <ellipse cx="286" cy="388" rx="60" ry="42" fill="#7d4c2d" opacity=".28"
                 filter="url(#ch-soft-sm)"/>
        <ellipse cx="434" cy="388" rx="60" ry="42" fill="#7d4c2d" opacity=".28"
                 filter="url(#ch-soft-sm)"/>

        <g clip-path="url(#ch-eye-l-clip)">
          <rect x="234" y="348" width="106" height="82" fill="url(#ch-sclera-g)"/>
          <g id="ch-pupil-l">
            <circle cx="288" cy="390" r="21" fill="url(#ch-iris)"/>
            <circle cx="288" cy="390" r="20.5" fill="none" stroke="#231305" stroke-width="3"
                    opacity=".75"/>
            <circle cx="288" cy="390" r="9.5" fill="#0f0904"/>
            <circle cx="280" cy="382" r="6.4" fill="#ffffff" opacity=".95"/>
            <circle cx="295" cy="398" r="2.8" fill="#ffffff" opacity=".45"/>
          </g>
          <path d="M234 348 h106 v14 c-30 -13 -76 -13 -106 3 Z" fill="#6b4026" opacity=".5"/>
          <ellipse id="ch-lid-l" cx="288" cy="304" rx="62" ry="50" fill="#a86c41"/>
        </g>

        <g clip-path="url(#ch-eye-r-clip)">
          <rect x="380" y="348" width="108" height="82" fill="url(#ch-sclera-g)"/>
          <g id="ch-pupil-r">
            <circle cx="432" cy="390" r="21" fill="url(#ch-iris)"/>
            <circle cx="432" cy="390" r="20.5" fill="none" stroke="#231305" stroke-width="3"
                    opacity=".75"/>
            <circle cx="432" cy="390" r="9.5" fill="#0f0904"/>
            <circle cx="424" cy="382" r="6.4" fill="#ffffff" opacity=".95"/>
            <circle cx="439" cy="398" r="2.8" fill="#ffffff" opacity=".45"/>
          </g>
          <path d="M380 348 h108 v14 c-30 -13 -78 -13 -108 3 Z" fill="#6b4026" opacity=".5"/>
          <ellipse id="ch-lid-r" cx="432" cy="304" rx="62" ry="50" fill="#a86c41"/>
        </g>

        <path d="M238 390 C 248 364 270 354 288 354 C 310 354 330 368 334 390"
              fill="none" stroke="#231a13" stroke-width="7.5" stroke-linecap="round"/>
        <path d="M386 390 C 390 368 410 354 432 354 C 450 354 472 364 482 390"
              fill="none" stroke="#231a13" stroke-width="7.5" stroke-linecap="round"/>
        <path d="M246 408 c22 17 60 17 84 1" fill="none" stroke="#7c4c2d" stroke-width="4"
              stroke-linecap="round" opacity=".65"/>
        <path d="M390 409 c24 16 62 16 84 -1" fill="none" stroke="#7c4c2d" stroke-width="4"
              stroke-linecap="round" opacity=".65"/>
        <!-- upper lid crease -->
        <path d="M240 356 c22 -18 68 -22 96 -6" fill="none" stroke="#754828" stroke-width="4"
              stroke-linecap="round" opacity=".45"/>
        <path d="M384 350 c28 -16 74 -12 96 6" fill="none" stroke="#754828" stroke-width="4"
              stroke-linecap="round" opacity=".45"/>
      </g>

      <!-- ==================== nose ==================== -->
      <g id="ch-nose">
        <path d="M360 396 c-6 30 -13 54 -18 68 c-5 12 3 20 15 21 h6 c12 -1 20 -9 15 -21
                 c-5 -14 -12 -38 -18 -68 Z" fill="#c98d5e" opacity=".42"
              filter="url(#ch-soft-xs)"/>
        <ellipse cx="360" cy="462" rx="42" ry="26" fill="#b87e51" opacity=".92"/>
        <ellipse cx="348" cy="452" rx="18" ry="11" fill="#dda876" opacity=".65"
                 filter="url(#ch-soft-xs)"/>
        <ellipse cx="326" cy="470" rx="12" ry="7.5" fill="#5a3520" opacity=".85"/>
        <ellipse cx="394" cy="470" rx="12" ry="7.5" fill="#5a3520" opacity=".85"/>
        <path d="M314 466 c-6 -15 5 -27 20 -29" fill="none" stroke="#8a5533" stroke-width="5"
              stroke-linecap="round" opacity=".55"/>
        <path d="M406 466 c6 -15 -5 -27 -20 -29" fill="none" stroke="#8a5533" stroke-width="5"
              stroke-linecap="round" opacity=".55"/>
      </g>

      <!-- ==================== mouth ==================== -->
      <g id="ch-mouth">
        <g id="ch-mouth-rest">
          <path d="M300 520 C 328 540 392 540 420 520 C 396 552 324 552 300 520 Z"
                fill="url(#ch-lip)"/>
          <path d="M300 520 C 328 536 392 536 420 520" fill="none" stroke="#3d2116"
                stroke-width="5.5" stroke-linecap="round"/>
          <path d="M310 540 c30 11 70 11 100 0" fill="none" stroke="#c08a68" stroke-width="5"
                stroke-linecap="round" opacity=".45"/>
        </g>

        <g id="ch-mouth-smile" opacity="0">
          <path d="M292 514 C 324 568 396 568 428 514 C 400 500 320 500 292 514 Z"
                fill="#3a1d14"/>
          <path d="M300 519 C 328 527 392 527 420 519 C 396 508 324 508 300 519 Z"
                fill="#fdfaf5"/>
          <path d="M314 550 C 338 566 382 566 406 550 C 382 542 338 542 314 550 Z"
                fill="#8c4c39"/>
          <path d="M292 514 C 324 568 396 568 428 514" fill="none" stroke="#39200f"
                stroke-width="5.5" stroke-linecap="round"/>
        </g>

        <path id="ch-crease-l" d="M280 486 c-8 26 -3 48 11 62" fill="none" stroke="#683e25"
              stroke-width="6" stroke-linecap="round" opacity=".3"/>
        <path id="ch-crease-r" d="M440 486 c8 26 3 48 -11 62" fill="none" stroke="#683e25"
              stroke-width="6" stroke-linecap="round" opacity=".3"/>
      </g>

      <!-- moustache over the top lip -->
      <path d="M290 502 C 310 478 340 472 360 486 C 380 472 410 478 430 502
               C 410 516 380 518 360 510 C 340 518 310 516 290 502 Z"
            fill="url(#ch-beard)"/>
      <path d="M294 500 C 312 480 340 476 360 488 C 380 476 408 480 426 500"
            fill="none" stroke="#40352e" stroke-width="4" stroke-linecap="round" opacity=".55"/>

      <!-- ==================== hair ==================== -->
      <g id="ch-hair">
        <path d="M186 330 C 170 226 202 138 272 100 C 314 76 358 68 400 70
                 C 468 74 524 106 550 166 C 572 216 570 278 556 330
                 C 548 292 534 268 518 252 C 494 284 444 296 388 292
                 C 330 288 278 280 236 258 C 212 272 194 298 186 330 Z"
              fill="url(#ch-hair)"/>

        <g clip-path="url(#ch-hair-clip)">
          <rect x="160" y="60" width="410" height="290" fill="url(#ch-coil)" opacity=".8"/>
          <ellipse cx="296" cy="146" rx="112" ry="58" fill="#6f5f52" opacity=".28"
                   filter="url(#ch-soft)"/>
          <ellipse cx="510" cy="244" rx="78" ry="92" fill="#050404" opacity=".45"
                   filter="url(#ch-soft)"/>
          <ellipse cx="214" cy="264" rx="60" ry="70" fill="#050404" opacity=".3"
                   filter="url(#ch-soft)"/>
        </g>

        <!-- irregular coils breaking the silhouette -->
        <g fill="#241d1a">
          <circle cx="200" cy="292" r="15"/><circle cx="190" cy="256" r="19"/>
          <circle cx="192" cy="216" r="14"/><circle cx="202" cy="180" r="20"/>
          <circle cx="224" cy="146" r="15"/><circle cx="248" cy="122" r="21"/>
          <circle cx="282" cy="100" r="16"/><circle cx="316" cy="84" r="20"/>
          <circle cx="354" cy="73" r="15"/><circle cx="392" cy="70" r="21"/>
          <circle cx="430" cy="76" r="16"/><circle cx="466" cy="92" r="20"/>
          <circle cx="500" cy="114" r="15"/><circle cx="528" cy="142" r="19"/>
          <circle cx="548" cy="176" r="14"/><circle cx="560" cy="214" r="20"/>
          <circle cx="562" cy="254" r="15"/><circle cx="554" cy="294" r="18"/>
          <circle cx="238" cy="160" r="12"/><circle cx="272" cy="132" r="16"/>
          <circle cx="308" cy="112" r="11"/><circle cx="346" cy="99" r="15"/>
          <circle cx="388" cy="94" r="11"/><circle cx="428" cy="100" r="16"/>
          <circle cx="466" cy="118" r="11"/><circle cx="498" cy="144" r="15"/>
          <circle cx="522" cy="176" r="11"/><circle cx="212" cy="200" r="12"/>
        </g>
        <g fill="#4a3e35" opacity=".55">
          <circle cx="256" cy="128" r="6.5"/><circle cx="300" cy="102" r="8"/>
          <circle cx="352" cy="86" r="6"/><circle cx="404" cy="84" r="8"/>
          <circle cx="452" cy="98" r="6.5"/><circle cx="492" cy="122" r="7.5"/>
          <circle cx="206" cy="192" r="5.5"/><circle cx="544" cy="192" r="6"/>
          <circle cx="228" cy="152" r="5.5"/><circle cx="520" cy="150" r="6"/>
        </g>

        <path d="M244 156 c48 -42 126 -54 192 -32" fill="none" stroke="#77655a"
              stroke-width="10" stroke-linecap="round" opacity=".28" filter="url(#ch-soft-xs)"/>
      </g>
    </g>
  </g>
</svg>
