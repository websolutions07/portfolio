<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Glossy blue violet cube">
  <defs>
    <linearGradient id="democube-top" x1="46" y1="34" x2="150" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9c8ff" />
      <stop offset="0.34" stop-color="#8aa0ff" />
      <stop offset="0.7" stop-color="#6a5cf7" />
      <stop offset="1" stop-color="#5a3ff0" />
    </linearGradient>

    <linearGradient id="democube-left" x1="50" y1="70" x2="104" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a4cf2" />
      <stop offset="0.48" stop-color="#4a29d6" />
      <stop offset="1" stop-color="#2f16a2" />
    </linearGradient>

    <linearGradient id="democube-right" x1="100" y1="96" x2="156" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d1cb2" />
      <stop offset="0.5" stop-color="#2a0e88" />
      <stop offset="1" stop-color="#1b0760" />
    </linearGradient>

    <linearGradient id="democube-rim" x1="150" y1="80" x2="120" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6bd2" stop-opacity="0.75" />
      <stop offset="0.55" stop-color="#8f6bff" stop-opacity="0.25" />
      <stop offset="1" stop-color="#4aa8ff" stop-opacity="0.55" />
    </linearGradient>

    <radialGradient id="democube-glow" cx="78" cy="60" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="democube-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <filter id="democube-drop" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>

    <filter id="democube-grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="23" result="democube-noise" />
      <feColorMatrix in="democube-noise" type="saturate" values="0" result="democube-mono" />
      <feComponentTransfer in="democube-mono">
        <feFuncA type="linear" slope="0.13" />
      </feComponentTransfer>
    </filter>

    <clipPath id="democube-clip-top">
      <polygon points="100,44 146,72 100,100 54,72" />
    </clipPath>
    <clipPath id="democube-clip-left">
      <polygon points="54,72 100,100 100,156 54,128" />
    </clipPath>
    <clipPath id="democube-clip-right">
      <polygon points="146,72 100,100 100,156 146,128" />
    </clipPath>
    <clipPath id="democube-clip-body">
      <polygon points="100,35 155,68 155,132 100,165 45,132 45,68" />
    </clipPath>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="104" cy="180" rx="58" ry="12" fill="#000000" opacity="0.38" filter="url(#democube-drop)" />
  <!-- coloured bounce light on the ground -->
  <ellipse cx="98" cy="176" rx="44" ry="9" fill="#5b3ff0" opacity="0.3" filter="url(#democube-drop)" />

  <g stroke-linejoin="round" stroke-width="13">
    <!-- right face (terminator side) -->
    <polygon points="146,72 100,100 100,156 146,128" fill="url(#democube-right)" stroke="url(#democube-right)" />
    <!-- left face -->
    <polygon points="54,72 100,100 100,156 54,128" fill="url(#democube-left)" stroke="url(#democube-left)" />
    <!-- top face -->
    <polygon points="100,44 146,72 100,100 54,72" fill="url(#democube-top)" stroke="url(#democube-top)" />
  </g>

  <!-- gloss sweep across the top face -->
  <g clip-path="url(#democube-clip-top)">
    <polygon points="88,34 128,58 92,80 56,60" fill="#ffffff" opacity="0.45" filter="url(#democube-soft)" />
    <rect x="0" y="0" width="200" height="200" fill="url(#democube-glow)" />
  </g>

  <!-- soft shading down the left face -->
  <g clip-path="url(#democube-clip-left)">
    <ellipse cx="60" cy="150" rx="46" ry="34" fill="#150653" opacity="0.5" filter="url(#democube-soft)" />
    <polygon points="58,76 96,100 96,116 58,94" fill="#a9b8ff" opacity="0.35" filter="url(#democube-soft)" />
  </g>

  <!-- rim light along the right face -->
  <g clip-path="url(#democube-clip-right)">
    <rect x="0" y="0" width="200" height="200" fill="url(#democube-rim)" />
    <ellipse cx="112" cy="118" rx="30" ry="40" fill="#0d0342" opacity="0.42" filter="url(#democube-soft)" />
  </g>

  <!-- crisp edge highlights -->
  <path d="M56 70 L100 43 L145 70" fill="none" stroke="#e3eaff" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round" />
  <path d="M56 74 L100 101 L144 74" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round" />

  <!-- specular hot-spot offset from centre -->
  <ellipse cx="80" cy="62" rx="11" ry="6" fill="#ffffff" opacity="0.9" filter="url(#democube-soft)" transform="rotate(28 80 62)" />
  <ellipse cx="77" cy="60" rx="4.5" ry="2.6" fill="#ffffff" transform="rotate(28 77 60)" />

  <g clip-path="url(#democube-clip-body)">
    <rect x="0" y="0" width="200" height="200" filter="url(#democube-grain)" style="mix-blend-mode:overlay" />
  </g>
</svg>
