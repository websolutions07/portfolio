<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Glossy purple blob">
  <defs>
    <clipPath id="decoblob-clip">
      <path d="M104 16 C142 14 176 42 183 82 C190 124 166 166 124 181 C84 195 36 176 21 138 C6 98 24 46 60 25 C74 17 89 16 104 16 Z" />
    </clipPath>

    <radialGradient id="decoblob-body" cx="66" cy="54" r="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dcb0ff" />
      <stop offset="0.2" stop-color="#b877f5" />
      <stop offset="0.48" stop-color="#8b3fe4" />
      <stop offset="0.76" stop-color="#631fba" />
      <stop offset="1" stop-color="#3c0d76" />
    </radialGradient>

    <radialGradient id="decoblob-deep" cx="150" cy="156" r="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c0760" stop-opacity="0.78" />
      <stop offset="0.6" stop-color="#43108c" stop-opacity="0.24" />
      <stop offset="1" stop-color="#43108c" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="decoblob-rim" x1="176" y1="120" x2="110" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6ad6" stop-opacity="0.6" />
      <stop offset="1" stop-color="#7d5bff" stop-opacity="0" />
    </linearGradient>

    <filter id="decoblob-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <filter id="decoblob-tight" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <filter id="decoblob-drop" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>

    <filter id="decoblob-organic" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="77" result="decoblob-warp" />
      <feDisplacementMap in="SourceGraphic" in2="decoblob-warp" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <filter id="decoblob-grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="1.05" numOctaves="3" seed="89" result="decoblob-noise" />
      <feColorMatrix in="decoblob-noise" type="saturate" values="0" result="decoblob-mono" />
      <feComponentTransfer in="decoblob-mono">
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="104" cy="188" rx="54" ry="11" fill="#000000" opacity="0.36" filter="url(#decoblob-drop)" />
  <ellipse cx="100" cy="185" rx="34" ry="7" fill="#7b2fd6" opacity="0.32" filter="url(#decoblob-drop)" />

  <g filter="url(#decoblob-organic)">
    <path d="M104 16 C142 14 176 42 183 82 C190 124 166 166 124 181 C84 195 36 176 21 138 C6 98 24 46 60 25 C74 17 89 16 104 16 Z" fill="url(#decoblob-body)" />
  </g>

  <g clip-path="url(#decoblob-clip)">
    <rect x="0" y="0" width="200" height="200" fill="url(#decoblob-deep)" />
    <rect x="0" y="0" width="200" height="200" fill="url(#decoblob-rim)" />

    <!-- depth-of-field blobs layered inside the body -->
    <ellipse cx="140" cy="70" rx="34" ry="26" fill="#c98cff" opacity="0.28" filter="url(#decoblob-soft)" />
    <ellipse cx="58" cy="140" rx="40" ry="30" fill="#2b0a5c" opacity="0.4" filter="url(#decoblob-soft)" />

    <rect x="0" y="0" width="200" height="200" filter="url(#decoblob-grain)" style="mix-blend-mode:overlay" />

    <!-- specular hot-spot offset up-left of centre -->
    <ellipse cx="62" cy="52" rx="26" ry="17" fill="#ffffff" opacity="0.72" filter="url(#decoblob-tight)" transform="rotate(-32 62 52)" />
    <ellipse cx="54" cy="45" rx="9" ry="5" fill="#ffffff" opacity="0.95" transform="rotate(-32 54 45)" />
    <!-- secondary bounce glint -->
    <ellipse cx="132" cy="152" rx="16" ry="8" fill="#ff9ae8" opacity="0.35" filter="url(#decoblob-soft)" transform="rotate(-24 132 152)" />
  </g>
</svg>
