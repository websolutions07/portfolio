  <path d="M120 268C210 300 170 364 264 406 358 448 400 510 540 620" fill="none" stroke="#2b4a1d" stroke-width="3" stroke-opacity="0.45"/>
  <path d="M200 264C320 306 330 362 424 404 520 448 570 505 700 620" fill="none" stroke="#2b4a1d" stroke-width="3" stroke-opacity="0.45"/>

  <!-- winding track on the near bank -->
  <path d="M-20 620C80 556 52 500 128 470 200 442 156 416 200 396" fill="none" stroke="url(#p02a-track)" stroke-width="34" stroke-linecap="round"/>
  <path d="M-20 620C80 556 52 500 128 470 200 442 156 416 200 396" fill="none" stroke="#f0dcb6" stroke-width="10" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- far trees and cottages -->
  <g filter="url(#p02a-blur-far)" opacity="0.9">
    <use href="#p02a-tree" transform="translate(140 292) scale(0.5)" color="#5d8a3e"/>
    <use href="#p02a-tree" transform="translate(268 288) scale(0.46)" color="#4f7c36"/>
    <use href="#p02a-tree" transform="translate(566 276) scale(0.48)" color="#618f42"/>
    <use href="#p02a-tree" transform="translate(712 286) scale(0.54)" color="#4a7433"/>
    <use href="#p02a-tree" transform="translate(858 292) scale(0.5)" color="#5a8a3c"/>
  </g>
  <g filter="url(#p02a-blur-soft)" opacity="0.95">
    <use href="#p02a-cottage" transform="translate(372 292) scale(0.5)"/>
    <use href="#p02a-cottage" transform="translate(506 282) scale(0.44)"/>
    <use href="#p02a-cottage" transform="translate(806 300) scale(0.52)"/>
  </g>

  <!-- bridge -->
  <g>
    <path d="M262 452 466 424" stroke="#2c4a1e" stroke-width="9" stroke-opacity="0.35" filter="url(#p02a-shadow)"/>
    <path d="M266 444C330 414 400 408 462 416L462 428C400 420 332 426 266 456Z" fill="#8a5c33"/>
    <path d="M266 444C330 414 400 408 462 416" fill="none" stroke="#c08b52" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#5f3c1e" stroke-width="1.6" stroke-opacity="0.6">
      <path d="M292 434 294 448"/><path d="M320 425 322 439"/><path d="M350 419 352 433"/>
      <path d="M382 415 384 429"/><path d="M414 414 416 428"/><path d="M444 415 446 429"/>
