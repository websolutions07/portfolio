  <use href="#p02a-cottage" transform="translate(778 336) scale(0.78)"/>
  <use href="#p02a-tree" transform="translate(596 300) scale(0.6)" color="#4c7b34"/>
  <use href="#p02a-tree" transform="translate(742 372) scale(0.78)" color="#6a9c40"/>
