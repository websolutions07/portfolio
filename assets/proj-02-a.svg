      <polygon points="64,0 88,-15 88,-61 64,-46" fill="url(#p02a-wall-side)"/>
      <polygon points="0,0 64,0 64,-5 0,-5" fill="#c9b28c" opacity="0.75"/>
      <polygon points="0,-46 32,-76 64,-46" fill="url(#p02a-gable)"/>
      <polygon points="-6,-42 32,-80 32,-75 0,-45" fill="#9c3a19"/>
      <polygon points="69,-44 93,-59 56,-93 32,-78" fill="url(#p02a-roof)"/>
      <g stroke="#8f3313" stroke-opacity="0.42" stroke-width="1.5" fill="none">
        <path d="M61.6-50.8 85.6-65.8"/>
        <path d="M54.2-57.6 78.2-72.6"/>
        <path d="M46.8-64.4 70.8-79.4"/>
        <path d="M39.4-71.2 63.4-86.2"/>
      </g>
      <polygon points="69,-44 93,-59 56,-93 32,-78" fill="url(#p02a-roof-sheen)"/>
      <path d="M-6-42 32-80 70-42" stroke="#c2542a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
      <path d="M32-79 56-94" stroke="#ffb583" stroke-width="5" stroke-linecap="round" fill="none"/>
      <g>
        <polygon points="60,-78 70,-78 70,-100 60,-100" fill="#e6d0ab"/>
        <polygon points="70,-78 77,-82 77,-104 70,-100" fill="#c9ac82"/>
        <polygon points="58,-100 72,-100 79,-104 65,-104" fill="#a8431f"/>
      </g>
      <g stroke="#c9ab7f" stroke-width="2">
