    <radialGradient id="p02a-foliage-shade" cx="0.7" cy="0.26" r="0.8">
      <stop offset="0.35" stop-color="#062012" stop-opacity="0"/>
      <stop offset="0.74" stop-color="#062012" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#03150c" stop-opacity="0.62"/>
    </radialGradient>
    <radialGradient id="p02a-foliage-hi" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c8" stop-opacity="0.66"/>
      <stop offset="0.55" stop-color="#e4f0a2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e4f0a2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p02a-glow" cx="0.4" cy="0.3" r="0.8">
