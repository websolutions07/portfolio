    <radialGradient id="p02a-vignette" cx="0.52" cy="0.42" r="0.8">
      <stop offset="0.48" stop-color="#100603" stop-opacity="0"/>
      <stop offset="1" stop-color="#100603" stop-opacity="0.45"/>
    </radialGradient>

    <filter id="p02a-shadow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="p02a-blur-far" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="p02a-blur-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="p02a-blur-bokeh" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="p02a-organic" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.026" numOctaves="3" seed="31" result="p02a-n"/>
      <feDisplacementMap in="SourceGraphic" in2="p02a-n" scale="30" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="p02a-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" seed="17" result="p02a-g"/>
      <feColorMatrix in="p02a-g" type="matrix"
        values="0 0 0 0 0.66  0 0 0 0 0.6  0 0 0 0 0.48  1.1 0 0 0 -0.54"/>
    </filter>

