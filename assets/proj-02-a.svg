  <!-- warm light wash -->
  <rect width="900" height="620" fill="url(#p02a-sun)" opacity="0.35"/>
  <rect width="900" height="620" fill="url(#p02a-vignette)"/>
  <rect width="900" height="620" filter="url(#p02a-grain)" opacity="0.28"/>
</svg>
