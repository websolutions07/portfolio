  <g filter="url(#p02a-organic)" opacity="0.3">
    <ellipse cx="180" cy="330" rx="180" ry="40" fill="#b5d074"/>
    <ellipse cx="700" cy="300" rx="200" ry="34" fill="#c2d97e"/>
    <ellipse cx="480" cy="520" rx="260" ry="60" fill="#2c4d1f"/>
    <ellipse cx="860" cy="440" rx="150" ry="46" fill="#6f9a44"/>
