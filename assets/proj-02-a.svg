      <path d="M-6-46 38-80 82-46" stroke="#c2542a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
      <g stroke="#c9ab7f" stroke-width="2">
        <path d="M14 0 14-26A9 9 0 0 1 32-26L32 0Z" fill="url(#p02a-glow)"/>
        <path d="M46 0 46-26A9 9 0 0 1 64-26L64 0Z" fill="url(#p02a-glow)"/>
      </g>
      <polygon points="-46,0 -8,0 -8,-92 -46,-92" fill="url(#p02a-wall-front)"/>
      <polygon points="-8,0 16,-15 16,-107 -8,-92" fill="url(#p02a-wall-side)"/>
      <polygon points="-49,-92 -5,-92 -15,-158" fill="url(#p02a-roof)"/>
      <polygon points="-5,-92 19,-107 -15,-158" fill="#b8451f"/>
      <polygon points="-49,-92 -5,-92 -15,-158" fill="url(#p02a-roof-sheen)"/>
      <path d="M-15-158 -15-176M-24-170 -6-170" stroke="#f6d489" stroke-width="3.4" stroke-linecap="round"/>
