        <rect x="42" y="-40" width="14" height="15" rx="1.5" fill="url(#p02a-glow)"/>
      </g>
      <path d="M15-40 15-25M8-32.5 22-32.5M49-40 49-25M42-32.5 56-32.5" stroke="#c9ab7f" stroke-width="1.4"/>
      <polygon points="70,-26 80,-32 80,-45 70,-39" fill="url(#p02a-glow)" stroke="#c9ab7f" stroke-width="1.6"/>
      <path d="M26 0 26-19A7 7 0 0 1 40-19L40 0Z" fill="#6b3d21"/>
      <path d="M27-1 27-19A6 6 0 0 1 39-19L39-1Z" fill="none" stroke="#a87445" stroke-width="1.4"/>
      <circle cx="32" cy="-58" r="4.5" fill="url(#p02a-glow)" stroke="#c9ab7f" stroke-width="1.4"/>
    </g>

