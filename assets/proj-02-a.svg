<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Miniature 3D diorama village with terracotta-roofed cottages, a chapel, rounded trees and a river in late afternoon light">
  <defs>
    <linearGradient id="p02a-sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f7d7f0"/>
      <stop offset="0.24" stop-color="#ffd9a8"/>
      <stop offset="0.58" stop-color="#ffc482"/>
      <stop offset="0.85" stop-color="#f9b487"/>
      <stop offset="1" stop-color="#eeae8e"/>
    </linearGradient>
    <radialGradient id="p02a-sun" cx="0.79" cy="0.11" r="0.52">
      <stop offset="0" stop-color="#fffdf0" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#ffeec0" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#ffd9a0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p02a-ground" x1="0.2" y1="0" x2="0.05" y2="1">
      <stop offset="0" stop-color="#a8c46a"/>
      <stop offset="0.3" stop-color="#7fa84c"/>
      <stop offset="0.68" stop-color="#547f36"/>
      <stop offset="1" stop-color="#2f5324"/>
    </linearGradient>
    <linearGradient id="p02a-water" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#dcefe6"/>
      <stop offset="0.2" stop-color="#8fcada"/>
      <stop offset="0.55" stop-color="#3d94b0"/>
      <stop offset="0.85" stop-color="#236f8e"/>
      <stop offset="1" stop-color="#17516d"/>
    </linearGradient>
    <linearGradient id="p02a-wall-front" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#e9d5b2"/>
      <stop offset="0.55" stop-color="#f7e8cd"/>
      <stop offset="1" stop-color="#fdf5e4"/>
    </linearGradient>
    <linearGradient id="p02a-wall-side" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset="1" stop-color="#ecd6b0"/>
