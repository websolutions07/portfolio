      <polygon points="0,-48 38,-78 76,-48" fill="url(#p02a-gable)"/>
      <polygon points="81,-46 105,-61 62,-95 38,-80" fill="url(#p02a-roof)"/>
      <g stroke="#8f3313" stroke-opacity="0.42" stroke-width="1.5" fill="none">
        <path d="M72.4-52.8 96.4-67.8"/>
        <path d="M63.8-59.6 87.8-74.6"/>
        <path d="M55.2-66.4 79.2-81.4"/>
        <path d="M46.6-73.2 70.6-88.2"/>
      </g>
